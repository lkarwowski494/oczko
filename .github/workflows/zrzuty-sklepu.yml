# Zrzuty sklepu (App Store Connect) z symulatora: iPhone 17 Pro Max (6.9″, 1320 × 2868) i iPad Pro 13″ (2064 × 2752), 7 ekranów, tryb jasny, OSOBNY ZESTAW NA KAŻDĄ LOKALIZACJĘ,
# z ramkami i podpisami jak w Treningu (KO-032, 10.11.2026: „Ma być jak w Treningu”; trening:.github/workflows/store-screenshots.yml, zadania zrzuty → ramki) i zrzutem zakupu dla App Review.
# Rola 10-wydanie, zadanie E-2 (2026-11-10); plan i opcja A: docs/wydanie/metadane/zrzuty-plan.md; wzór: Trening `store-screenshots.yml` (zadania dane → build → zrzuty → ramki).
# Wyjście: artefakt `sklep-zrzuty-ramki` zgodny z kontraktem `asc-zrzuty.yml` / sklep.md §3b: `6.9/<język>/NN-*.png`, `ipad-13/<język>/NN-*.png`, PNG bez alfy, z ramką i podpisem
# (scripts/ci/ramki-sklepu.sh, podpisy: docs/wydanie/metadane/podpisy-zrzutow.json; język bez podpisów dostaje tylko surowe zrzuty w artefakcie `sklep-zrzuty-surowe`);
# artefakt `zrzut-zakupu` (99-zakup-ceny.png, ekran ofert z atrapą sklepu) — do ręcznego wgrania przez właściciela przy produktach. Zrzuty wzoru (03, 04) czekają w `warunek-og07/` do znacznika [og07-ok].
# Bez sekretów i bez środowiska `release`; niczego nie wysyła do App Store Connect (to robi dopiero `asc-zrzuty.yml` z `main`, za zgodą właściciela).
# Wyzwalacze: (1) push na gałąź roboczą ze znacznikiem [zrzuty-sklepu] w komunikacie commita (workflow_dispatch nowego pliku działa dopiero z `main`);
# [zrzuty-app:<numer przebiegu>] = użyj aplikacji z wcześniejszego przebiegu TEGO workflowu (artefakt `zrzuty-sklepu-app`, 3 dni) zamiast budować od nowa (~40 min);
# [og07-ok] = zrzuty wzoru idą do kompletu; [zrzuty-jezyki:en,pl] albo [zrzuty-jezyki:all] = języki aplikacji (domyślnie en,pl; all = 29 z lokalizacją sklepu);
# [zrzuty-zadan:N] = na ile zadań dzielić języki na urządzenie (domyślnie 6, najwyżej 8); [zrzuty-urzadzenia:iphone] = tylko iPhone (domyślnie iphone,ipad);
# 10-wydanie-002 (uzupełnienie, jak trening:.github/workflows/store-screenshots.yml:37-44): [zrzuty-uzupelnij:<numer przebiegu>] = weź gotowe zrzuty z artefaktu `sklep-zrzuty-surowe` TEGO workflowu (14 dni)
# i zrób tylko brakujące sceny; [zrzuty-powtorz:ja/04-zakreslenie,…] = te sceny od nowa mimo gotowego pliku (`en/99-zakup` = zrzut zakupu od nowa); wynik = komplet (zadanie „zbierz” nakłada nowe na poprzednie).
# (2) workflow_dispatch (po scaleniu do `main`) z tymi samymi wejściami. Czas: ≈ 30 min na język i urządzenie (7 scen po ≈ 4 min), naraz najwyżej 3 zadania macOS.
# Maszyn macOS zwykle brak ok. 14:00–23:00 UTC; awaria przed pierwszym scenariuszem albo „not acquired by Runner” = jedno ponowienie ręczne (P-091, CLAUDE.md).
name: Zrzuty sklepu
on:
  push:
    branches: [claude/e-zrzuty-sklepu-2026-11-10, claude/youthful-pasteur-kx83sn]   # druga: integracja (od P-559), tu powstanie kandydat buildu 3; plik workflowu musi tam trafić ze scaleniem gałęzi E (koordynator)
  workflow_dispatch:
    inputs:
      aplikacja_z_przebiegu:
        description: 'Numer przebiegu TEGO workflowu z gotową aplikacją (artefakt zrzuty-sklepu-app, 3 dni); pusty = zbuduj od nowa (~40 min)'
        required: false
        type: string
        default: ''
      og07:
        description: 'Warunek OG-07 spełniony: zrzuty wzoru (03, 04) trafiają do kompletu (jeśli nie: katalog warunek-og07)'
        required: false
        type: boolean
        default: false
      jezyki:
        description: 'Języki aplikacji po przecinku (np. "en,pl,de") albo "all" (29 języków z lokalizacją sklepu); język bez podpisów w podpisy-zrzutow.json dostaje tylko surowe zrzuty'
        required: false
        type: string
        default: 'en,pl'
      zadan:
        description: 'Na ile zadań podzielić języki na urządzenie (1–8). Naraz biegną najwyżej 3 zadania macOS; ≈ 30 min na język'
        required: false
        type: string
        default: '6'
      urzadzenia:
        description: 'Urządzenia po przecinku: iphone, ipad'
        required: false
        type: string
        default: 'iphone,ipad'
      uzupelnij_z_przebiegu:
        description: 'Numer przebiegu TEGO workflowu, z którego bierzemy gotowe zrzuty (artefakt sklep-zrzuty-surowe, 14 dni): robimy tylko brakujące sceny, wynik = komplet dla języków z wejścia jezyki. Pusty = wszystko od nowa'
        required: false
        type: string
        default: ''
      powtorz:
        description: 'Przy uzupelnij_z_przebiegu: sceny do zrobienia od nowa mimo gotowego pliku (po przecinku, język/NN-scena, np. "ja/04-zakreslenie"); "en/99-zakup" = zrzut zakupu od nowa; pusty = żadne'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
# 10-wydanie-005: BEZ grupy na poziomie workflowu — startuje na KAŻDY push na integrację, a oczekujący przebieg w grupie jest anulowany przez następny (zwykły push anulowałby przebieg ze znacznikiem
# [zrzuty-sklepu] czekający na maszyny macOS). Grupy mają tylko zadania macOS (build, zrzuty); przebieg bez znacznika (zadanie plan: uruchom=false) dostaje grupę z run_id, więc niczego nie anuluje.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      uruchom: ${{ steps.wejscie.outputs.uruchom }}
      app_run: ${{ steps.wejscie.outputs.app_run }}
      og07: ${{ steps.wejscie.outputs.og07 }}
      matrix: ${{ steps.plan.outputs.matrix }}
      jezyki: ${{ steps.plan.outputs.jezyki }}
      zadania: ${{ steps.plan.outputs.zadania }}
      urz: ${{ steps.wejscie.outputs.urz }}
      uzup: ${{ steps.wejscie.outputs.uzup }}
      powtorz: ${{ steps.wejscie.outputs.powtorz }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: wejscie
        env:
          ZDARZENIE: ${{ github.event_name }}
          KOMUNIKAT: ${{ github.event.head_commit.message }}
          WE_APP: ${{ inputs.aplikacja_z_przebiegu }}
          WE_OG07: ${{ inputs.og07 }}
          WE_JEZYKI: ${{ inputs.jezyki }}
          WE_ZADAN: ${{ inputs.zadan }}
          WE_URZADZENIA: ${{ inputs.urzadzenia }}
          WE_UZUP: ${{ inputs.uzupelnij_z_przebiegu }}
          WE_POWTORZ: ${{ inputs.powtorz }}
        run: |
          uruchom=false; app=""; og07=false; jez="en,pl"; zadan=6; urz="iphone,ipad"; uzup=""; powt=""
          # znaczniki tylko z PIERWSZEJ linii komunikatu: treść commitu może je opisywać (przebieg 1: opis „[og07-ok]” w treści włączył OG-07)
          KOMUNIKAT=$(printf '%s\n' "$KOMUNIKAT" | head -1)
          if [ "$ZDARZENIE" = workflow_dispatch ]; then
            uruchom=true; app="$WE_APP"; [ "$WE_OG07" = true ] && og07=true
            jez="${WE_JEZYKI:-en,pl}"; zadan="${WE_ZADAN:-6}"; urz="${WE_URZADZENIA:-iphone,ipad}"; uzup="$WE_UZUP"; powt="$WE_POWTORZ"
          else
            case "$KOMUNIKAT" in *'[zrzuty-sklepu]'*) uruchom=true ;; esac
            app=$(printf '%s' "$KOMUNIKAT" | sed -n 's/.*\[zrzuty-app:\([0-9][0-9]*\)\].*/\1/p' | head -1)
            case "$KOMUNIKAT" in *'[og07-ok]'*) og07=true ;; esac
            w=$(printf '%s' "$KOMUNIKAT" | sed -n 's/.*\[zrzuty-jezyki:\([A-Za-z0-9,-]*\)\].*/\1/p' | head -1); [ -z "$w" ] || jez="$w"
            w=$(printf '%s' "$KOMUNIKAT" | sed -n 's/.*\[zrzuty-zadan:\([0-9]*\)\].*/\1/p' | head -1); [ -z "$w" ] || zadan="$w"
            w=$(printf '%s' "$KOMUNIKAT" | sed -n 's/.*\[zrzuty-urzadzenia:\([a-z,]*\)\].*/\1/p' | head -1); [ -z "$w" ] || urz="$w"
            uzup=$(printf '%s' "$KOMUNIKAT" | sed -n 's/.*\[zrzuty-uzupelnij:\([0-9][0-9]*\)\].*/\1/p' | head -1)
            powt=$(printf '%s' "$KOMUNIKAT" | sed -n 's/.*\[zrzuty-powtorz:\([A-Za-z0-9,/-]*\)\].*/\1/p' | head -1)
          fi
          # Wejścia ręczne trafiają do $GITHUB_OUTPUT i do skryptów: tylko dozwolone znaki (nowa linia w wejściu nie dopisze cudzego wyjścia); sens (język, scena) sprawdza skrypt planu (kod 2)
          for par in "numer przebiegu aplikacji:$app:*[!0-9]*" "uzupelnij_z_przebiegu:$uzup:*[!0-9]*" "jezyki:$jez:*[!A-Za-z0-9,-]*" "zadan:$zadan:*[!0-9]*" "urzadzenia:$urz:*[!a-z,]*" "powtorz:$powt:*[!A-Za-z0-9,/-]*"; do
            nazwa="${par%%:*}"; reszta="${par#*:}"; wartosc="${reszta%:*}"; wzor="${reszta##*:}"
            case "$wartosc" in $wzor) echo "::error::wejście $nazwa ma niedozwolone znaki"; exit 2 ;; esac
          done
          { echo "uruchom=$uruchom"; echo "app_run=$app"; echo "og07=$og07"; echo "jez=$jez"; echo "zadan=$zadan"; echo "urz=$urz"; echo "uzup=$uzup"; echo "powtorz=$powt"; } >> "$GITHUB_OUTPUT"
      - name: Poprzednie surowe zrzuty (tylko przy uzupełnieniu; artefakt sklep-zrzuty-surowe poprzedniego przebiegu — już po nałożeniu jego własnych uzupełnień, więc kolejne uzupełnienia się łańcuchują)
        if: steps.wejscie.outputs.uruchom == 'true' && steps.wejscie.outputs.uzup != ''
        uses: actions/download-artifact@v4
        with:
          name: sklep-zrzuty-surowe
          path: poprzednie
          run-id: ${{ steps.wejscie.outputs.uzup }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          URUCHOM: ${{ steps.wejscie.outputs.uruchom }}
          APP: ${{ steps.wejscie.outputs.app_run }}
          OG07: ${{ steps.wejscie.outputs.og07 }}
          JEZ: ${{ steps.wejscie.outputs.jez }}
          ZADAN: ${{ steps.wejscie.outputs.zadan }}
          URZ: ${{ steps.wejscie.outputs.urz }}
          UZUP: ${{ steps.wejscie.outputs.uzup }}
          POWTORZ: ${{ steps.wejscie.outputs.powtorz }}
        run: |
          # Zadanie zrzuty i tak jest pomijane (uruchom=false albo zadania=0), ale macierz z pustej listy bywa błędem składni — stąd jeden wpis zastępczy
          zastepcza='[{"urzadzenie":"iphone","jezyki":"en","nr":1,"zakup":false}]'
          matrix='{"jezyki":["en"],"matrix":[],"zadania":0}'
          # Wejścia z wejść ręcznych idą przez env i walidację w skrypcie planu (nieznany język, język bez lokalizacji sklepu, złe urządzenie = czerwony plan)
          if [ "$URUCHOM" = true ]; then
            poprzednie=""
            if [ -n "$UZUP" ]; then
              # brak zrzutów w pobranym artefakcie = czerwony plan; inaczej uzupełnienie po cichu zrobiłoby WSZYSTKO od nowa (≈ 10 h)
              [ -n "$(find poprzednie -name '*.png' 2>/dev/null | head -1)" ] || { echo "::error::przebieg $UZUP: artefakt sklep-zrzuty-surowe bez zrzutów (zły numer albo wygasł po 14 dniach)"; exit 1; }
              node scripts/ci/zrzuty-uzupelnij.mjs powtorz poprzednie "$POWTORZ" | tee -a "$GITHUB_STEP_SUMMARY"
              poprzednie=poprzednie
            fi
            matrix=$(node scripts/ci/zrzuty-jezyki.mjs "$JEZ" "$ZADAN" "$URZ" "$poprzednie" "$POWTORZ")
          fi
          zadania=$(printf '%s' "$matrix" | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).zadania))')
          { echo "zadania=$zadania"
            if [ "$zadania" = 0 ]; then echo "matrix=$zastepcza"; else echo "matrix=$(printf '%s' "$matrix" | node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync(0,"utf8")).matrix))')"; fi
            echo "jezyki=$(printf '%s' "$matrix" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).jezyki.join(","))')"; } >> "$GITHUB_OUTPUT"
          echo "uruchom=$URUCHOM, aplikacja z przebiegu: ${APP:-(budowa)}, OG-07: $OG07, języki: $JEZ, zadań: $ZADAN, urządzenia: $URZ, uzupełnienie z przebiegu: ${UZUP:-(brak)}, zadań macOS: $zadania" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$URUCHOM" != true ] || [ -z "$UZUP" ] || printf '%s' "$matrix" | node -e 'for (const m of JSON.parse(require("fs").readFileSync(0,"utf8")).matrix) console.log(`  ${m.urzadzenie} #${m.nr}: ${m.jezyki || "(tylko zakup)"} → ${m.sceny || "-"}`)' | tee -a "$GITHUB_STEP_SUMMARY"
  build:
    needs: plan
    if: needs.plan.outputs.uruchom == 'true' && needs.plan.outputs.app_run == '' && needs.plan.outputs.zadania != '0'
    concurrency:
      group: zrzuty-sklepu-build-${{ needs.plan.outputs.uruchom == 'true' && github.ref || github.run_id }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Xcode 26.x (najnowszy z obrazu, P-091 5a)
        run: bash .github/scripts/jakosc/select-xcode.sh 26 && xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: expo prebuild
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Intencja w celu aplikacji (_shared/Stuknij.swift; P-180)
        # @bacons/apple-targets dodaje targets/widget/_shared/* do celu aplikacji zbiorem wyjątków grupy synchronizowanej; bez tego
        # +1 z Live Activity nie ma intencji w procesie aplikacji. Test kontroli: tests/jakosc/czlonkostwo-celu.test.ts.
        run: |
          set -o pipefail # domyślny bash -e bez pipefail: kod skryptu zginąłby w potoku do tee
          node scripts/natywne/czlonkostwo-celu.mjs --pbxproj ios/*.xcodeproj/project.pbxproj --plik _shared/Stuknij.swift | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ikona zegarka w projekcie (P-350; Trening L-021, jak verify:native)
        # Cel zegarka bez ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon: brak CFBundleIconName, App Store Connect odrzuca wysyłkę (build 1026 w Treningu). Test: tests/jakosc/ikona-zegarka-prebuild.test.ts.
        run: |
          set -o pipefail # kod skryptu nie może zginąć w potoku do tee
          node scripts/natywne/ikona-zegarka.mjs --pbxproj ios/*.xcodeproj/project.pbxproj | tee -a "$GITHUB_STEP_SUMMARY"
      - name: pods
        run: cd ios && pod install 2>&1 | tee pod-install.log
      - name: Cele natywne podłączone (ADR-0006, ADR-0007; 08 partia 3)
        # Moduł z wyższym minimum niż aplikacja jest po cichu pomijany („was not linked”) — build zostaje zielony bez modułu.
        run: |
          set -e
          if grep -q 'was not linked' ios/pod-install.log; then grep 'was not linked' ios/pod-install.log; echo "::error::moduł Expo niepodłączony"; exit 1; fi
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 18.0' ios/*.xcodeproj/project.pbxproj || { echo "::error::IPHONEOS_DEPLOYMENT_TARGET ≠ 18.0 (ADR-0006)"; exit 1; }
          for p in OczkoDziennikPlus OczkoCzasWTle; do grep -q "$p" ios/Podfile.lock || { echo "::error::brak poda $p"; exit 1; }; done
      - name: Platforma iOS zgodna z SDK (pobranie tylko, gdy jej brak)
        run: bash .github/scripts/jakosc/ensure-ios-platform.sh
      - name: Build (Release, symulator, bez podpisu)
        env:
          # Przełączniki testowe TYLKO w tym buildzie (strażnik: scripts/jakosc/sprawdz-workflowy.mjs, kontrole-repo.mjs; e2e/README.md): E2E daje wstrzyknięty zegar
          # (oczkoE2eTeraz) i testowy PDF (panel e2e-wzor-pdf) — bez nich nie da się ułożyć powtarzalnych danych fikcyjnych ani wzoru na CI.
          EXPO_PUBLIC_E2E: '1'
          EXPO_PUBLIC_STORE_FAKE: '1'
          EXPO_PUBLIC_ICLOUD_FAKE: '1' # atrapa silnika iCloud (P-230, moduly.md „Atrapa silnika w E2E”); kontrola ATRAPA-ICLOUD
          # BEZ EXPO_PUBLIC_WATCH_FAKE (zrzuty-sklepu.test.ts): panel „Watch state: none” (e2e-zegarek-stan) leży na ekranie licznika i zostałby w kadrze sklepu.
        run: |
          set -o pipefail
          cd ios
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          echo "Workspace $WS, schemat $SCHEME" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify
          ls -d build/Build/Products/Release-iphonesimulator/*.app
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          # Widżet osadzony i z kodem Live Activity; intencja i moduł w aplikacji (nazwy typów Swift w metadanych binarek)
          test -d "$APP/PlugIns/OczkoWidget.appex"
          # Do pliku, nie potokiem: grep -q kończy wcześnie, strings dostaje SIGPIPE i przy pipefail krok pada (przebieg 40262653714)
          strings -a "$APP/PlugIns/OczkoWidget.appex/OczkoWidget" > "$RUNNER_TEMP/widget.txt"
          strings -a "$APP/$(basename "$APP" .app)" > "$RUNNER_TEMP/aplikacja.txt"
          grep -q OczkoAktywnosc "$RUNNER_TEMP/widget.txt" || { echo "::error::widżet bez OczkoAktywnosc"; exit 1; }
          grep -q OczkoStuknij "$RUNNER_TEMP/aplikacja.txt" || { echo "::error::aplikacja bez intencji OczkoStuknij"; exit 1; }
          grep -q IntencjaEkranuBlokady "$RUNNER_TEMP/aplikacja.txt" || { echo "::error::aplikacja bez modułu OczkoDziennikPlus"; exit 1; }
          echo "Cele natywne: widżet, intencja i moduł w binarkach" >> "$GITHUB_STEP_SUMMARY"
      - name: "Zapis aplikacji (do ponownego użycia przez [zrzuty-app:<numer przebiegu>])"
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          APP=$(ls -d *.app | head -1); zip -qry "$GITHUB_WORKSPACE/zrzuty-sklepu-app.zip" "$APP"
          echo "Aplikacja: $APP ($(du -sh "$APP" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: zrzuty-sklepu-app
          path: zrzuty-sklepu-app.zip
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          retention-days: 3
  zrzuty:
    name: 'zrzuty (${{ matrix.urzadzenie }} ${{ matrix.nr }}: ${{ matrix.jezyki }})'
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.uruchom == 'true' && needs.plan.outputs.zadania != '0' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    # grupa na gałąź macierzy (urządzenie × nr): wspólna grupa wszystkich gałęzi puściłaby jedną naraz i anulowała oczekujące
    concurrency:
      group: zrzuty-sklepu-${{ needs.plan.outputs.uruchom == 'true' && github.ref || github.run_id }}-${{ matrix.urzadzenie }}-${{ matrix.nr }}
      cancel-in-progress: false
    runs-on: macos-26
    # ≈ 8 min danych fikcyjnych + ≈ 30 min na język (pomiar: przebieg 42784539154, 34 min na 7 scen); do 5 języków na zadanie → ≈ 2,5 h; limit zadania w Actions 6 h
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3 # jak Trening: 2 maszyny macOS z 5 zostają dla E2E i buildu
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Xcode 26.x (najnowszy z obrazu, P-091 5a)
        run: bash .github/scripts/jakosc/select-xcode.sh 26 && xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.app_run != ''
        with:
          name: zrzuty-sklepu-app
          run-id: ${{ needs.plan.outputs.app_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.app_run == ''
        with:
          name: zrzuty-sklepu-app
      - name: Symulator (iPhone 17 Pro Max 6.9″ albo iPad Pro 13″)
        env:
          URZADZENIE: ${{ matrix.urzadzenie }}
        run: |
          mkdir -p app-sim && unzip -q zrzuty-sklepu-app.zip -d app-sim
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          LIST=$(xcrun simctl list devices available | awk -v h="-- iOS $SDK --" '$0 == h { f = 1; next } /^-- / { f = 0 } f')
          [ -n "$LIST" ] || LIST=$(xcrun simctl list devices available)
          DEV=""
          if [ "$URZADZENIE" = ipad ]; then WZORY=("iPad Pro 13-inch" "iPad Air 13-inch"); else WZORY=("iPhone 17 Pro Max \(" "iPhone 16 Pro Max \("); fi
          for pat in "${WZORY[@]}"; do
            DEV=$(printf '%s\n' "$LIST" | node .github/scripts/jakosc/sim-wybor.mjs "$pat" || true)
            [ -n "$DEV" ] && break
          done
          [ -n "$DEV" ] || { echo "::error::Brak symulatora ($URZADZENIE)"; printf '%s\n' "$LIST" | grep -E 'iPhone|iPad' | sed -E 's/\([0-9A-F-]{36}\)//'; exit 1; }
          echo "Symulator ($URZADZENIE): $(xcrun simctl list devices available | grep -F "$DEV" | sed -E 's/\([0-9A-F-]{36}\)//') (iOS $SDK)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SIM=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance light || true
          xcrun simctl install "$DEV" app-sim/*.app
      - name: Maestro
        env:
          # Jedna zmienna przypięcia (DS-07, zasada wspólna 21; 07-jakosc-005): zmiana wersji = commit. 2.12.1 = wersja z przebiegów #139/#140.
          # Pusta = błąd (nie „najnowsza”); zainstalowana ≠ przypięta = błąd. Kontrola: sprawdz-workflowy.mjs (MAESTRO-WERSJA), tests/jakosc/ci-maestro-wersja.test.ts.
          MAESTRO_VERSION: '2.12.1'
          # P-626 d (07-reaudit 9.11): paczka przypiętej wersji wprost z GitHub Releases z ponawianiem, bez skryptu get.maestro.mobile.dev (ten pobiera
          # jednym `curl --fail` bez ponowień — przebieg 4, run 42578327316: 504 z release-assets.githubusercontent.com zatrzymał 3 z 4 części przed 1. scenariuszem).
          # SHA-256 maestro.zip cli-2.12.1 (pobrany 9.11.2026 z adresu niżej); zmiana wersji = commit obu wartości. Kontrola: MAESTRO-POBRANIE, ci-maestro-wersja.test.ts.
          MAESTRO_ZIP_SHA256: '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7'
        run: |
          [ -n "$MAESTRO_VERSION" ] || { echo "::error::MAESTRO_VERSION pusta — wersja Maestro musi być przypięta (DS-07, zasada wspólna 21)"; exit 1; }
          zip="$RUNNER_TEMP/maestro.zip"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 20 --connect-timeout 30 -o "$zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          printf '%s  %s\n' "$MAESTRO_ZIP_SHA256" "$zip" | shasum -a 256 -c - || { echo "::error::maestro.zip $MAESTRO_VERSION ma inny SHA-256 niż przypięty (MAESTRO_ZIP_SHA256)"; exit 1; }
          rm -rf "$RUNNER_TEMP/maestro-zip" "$HOME/.maestro" && mkdir -p "$HOME/.maestro"
          unzip -q "$zip" -d "$RUNNER_TEMP/maestro-zip"
          cp -R "$RUNNER_TEMP/maestro-zip/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          v=$("$HOME/.maestro/bin/maestro" --version)
          echo "Maestro: $v (przypięta $MAESTRO_VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$v" | grep -qF "$MAESTRO_VERSION" || { echo "::error::zainstalowano Maestro $v, przypięta jest $MAESTRO_VERSION"; exit 1; }
      - name: Zrzuty
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000' # Trening: świeży symulator potrzebuje więcej czasu na sterownik XCTest
          MAESTRO_CLI_NO_ANALYTICS: '1'
          OG07: ${{ needs.plan.outputs.og07 }}
          URZADZENIE: ${{ matrix.urzadzenie }}
          JEZYKI: ${{ matrix.jezyki }}
          ZAKUP: ${{ matrix.zakup }}
          SCENY_PLAN: ${{ matrix.sceny }} # uzupełnienie: "język=scena,scena;…" (pusta = wszystkie sceny)
        run: bash scripts/ci/zrzuty-sklepu.sh "$SIM" "$URZADZENIE" "zrzuty-surowe" "dzienniki" "$OG07" "$JEZYKI" "$ZAKUP" "zrzut-zakupu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-surowe-${{ matrix.urzadzenie }}-${{ matrix.nr }}
          retention-days: 7
          if-no-files-found: ignore
          path: zrzuty-surowe
      - uses: actions/upload-artifact@v4
        if: always() && matrix.zakup
        with:
          name: zrzut-zakupu
          retention-days: 14
          if-no-files-found: ignore
          path: zrzut-zakupu
      - name: Spakowanie dzienników (Maestro zapisuje katalogi z „:” w nazwie, których upload-artifact nie przyjmuje)
        if: always()
        run: '[ -d dzienniki ] && zip -qry dzienniki.zip dzienniki || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-dzienniki-${{ matrix.urzadzenie }}-${{ matrix.nr }}
          retention-days: 3
          if-no-files-found: ignore
          path: dzienniki.zip
  zbierz:
    name: komplet (bez alfy, wymiary, ramki i podpisy)
    needs: [plan, zrzuty]
    # zadania = 0: uzupełnienie bez brakujących scen — macOS niepotrzebny, a komplet składa się z poprzednich zrzutów
    if: ${{ !cancelled() && needs.plan.outputs.uruchom == 'true' && (needs.zrzuty.result != 'skipped' || needs.plan.outputs.zadania == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci # test ramek (Jest) biegnie w tym zadaniu, patrz krok „Test ramek” niżej
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.zadania != '0'
        with:
          pattern: zrzuty-surowe-*
          path: surowe
          merge-multiple: true
      - name: Poprzednie surowe zrzuty (tylko przy uzupełnieniu)
        if: needs.plan.outputs.uzup != ''
        uses: actions/download-artifact@v4
        with:
          name: sklep-zrzuty-surowe
          path: poprzednie
          run-id: ${{ needs.plan.outputs.uzup }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Nałożenie poprzednich zrzutów na nowe (powtórki usunięte; nowe nie są nadpisywane; przy OG-07 sceny wzoru do kompletu)
        if: needs.plan.outputs.uzup != ''
        env:
          POWTORZ: ${{ needs.plan.outputs.powtorz }}
          OG07: ${{ needs.plan.outputs.og07 }}
        run: |
          mkdir -p surowe
          node scripts/ci/zrzuty-uzupelnij.mjs powtorz poprzednie "$POWTORZ"
          node scripts/ci/zrzuty-uzupelnij.mjs nalozenie poprzednie surowe "$OG07" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ImageMagick i czcionki (Noto Sans dla bg, el, nl, ru, sr, uk, vi; Noto Sans CJK dla ja, ko, zh-Hant)
        # 10-wydanie-007: wersje narzędzi do podsumowania (wygląd podpisów zależy od ImageMagicka i czcionek Noto z obrazu runnera; zasada wspólna 21)
        run: |
          set -eo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-noto-core fonts-noto-cjk >/dev/null
          { echo "ImageMagick: $(convert -version | head -1)"; dpkg-query -W -f='czcionki: ${Package} ${Version}\n' fonts-noto-core fonts-noto-cjk; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 'Test ramek i podpisów na sztucznych PNG (ImageMagick wymagany przez OCZKO_WYMAGAJ_IMAGEMAGICK=1; w npm run verify na CI ta część jest pominięta głośno, KO-035)'
        # 10-wydanie-009: kontrola, że ramki-sklepu.sh działa naprawdę, biegnie tu, po instalacji ImageMagicka i przed krokiem ramek (jak Trening: ImageMagick tylko w workflowie zrzutów).
        env:
          OCZKO_WYMAGAJ_IMAGEMAGICK: '1'
        run: npx jest tests/wydanie/ramki-sklepu.test.ts --ci --runInBand
      - name: Kanał alfa precz (surowe zrzuty simctl są RGB; spłaszczenie na wszelki wypadek)
        run: |
          set -uo pipefail
          mkdir -p sklep-zrzuty-surowe
          while IFS= read -r f; do
            rel="${f#surowe/}"; mkdir -p "$(dirname "sklep-zrzuty-surowe/$rel")"
            convert "$f" -alpha off -depth 8 -define png:color-type=2 "sklep-zrzuty-surowe/$rel"
          done < <(find surowe -name '*.png' | sort)
          echo "Surowe zrzuty: $(find sklep-zrzuty-surowe -name '*.png' | wc -l | tr -d ' ') plików" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 'Komplet zrzutów i wymiary (iPhone 6.9″ = 1320x2868, iPad 13″ = 2064x2752 albo poziomo 2752x2064; bez alfy; najwyżej 10 na klasę): wymiary-asc.mjs, komplet-zrzutow.mjs'
        env:
          JEZYKI: ${{ needs.plan.outputs.jezyki }}
          URZADZENIA: ${{ needs.plan.outputs.urz }} # z wejścia, nie z macierzy: przy uzupełnieniu urządzenie bez braków nie ma zadań, a komplet sprawdzamy dla wszystkich
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail; bledy=0
          node scripts/ci/wymiary-asc.mjs sklep-zrzuty-surowe | tee -a "$GITHUB_STEP_SUMMARY" || bledy=1
          node scripts/ci/komplet-zrzutow.mjs sklep-zrzuty-surowe "$JEZYKI" "$URZADZENIA" | tee -a "$GITHUB_STEP_SUMMARY" || bledy=1
          if [ "$bledy" -ne 0 ]; then echo "Brakujące sceny można dorobić bez powtarzania całości: uzupelnij_z_przebiegu=$RUN_ID (albo znacznik [zrzuty-uzupelnij:$RUN_ID] w commicie)." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          [ "$bledy" -eq 0 ]
      - name: Ramki i podpisy (jak Trening, scripts/ci/ramki-sklepu.sh; język bez podpisów pominięty z ostrzeżeniem)
        # 10-wydanie-002: always() — czerwony komplet (brak jednej sceny w jednym języku) nie odbiera ramek pozostałym językom; przebieg zostaje czerwony z kroku „komplet”,
        # a niepełny zestaw trafia do artefaktu `sklep-zrzuty-ramki` do świadomej oceny (uzupełnienie brakujących scen: wejście uzupelnij_z_przebiegu).
        if: always()
        run: |
          set -o pipefail
          if [ -z "$(find sklep-zrzuty-surowe -name '*.png' 2>/dev/null | head -1)" ]; then echo "::warning::brak surowych zrzutów — bez ramek" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          bash scripts/ci/ramki-sklepu.sh sklep-zrzuty-surowe sklep-zrzuty-ramki docs/wydanie/metadane/podpisy-zrzutow.json | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/ci/wymiary-asc.mjs sklep-zrzuty-ramki | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Języki z ramkami: $(find sklep-zrzuty-ramki -mindepth 2 -maxdepth 2 -type d ! -path '*warunek-og07*' -exec basename {} \; | sort -u | paste -sd, -)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sklep-zrzuty-surowe
          retention-days: 14
          if-no-files-found: ignore
          path: sklep-zrzuty-surowe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sklep-zrzuty-ramki
          retention-days: 14
          if-no-files-found: ignore
          path: sklep-zrzuty-ramki
