# Fala przekładu przez API Anthropic (P-474, P-144; wzór: repo trening). Tylko ręcznie, odczyt repozytorium, bez środowiska (environment).
# Zakres: 33 języki (bez pl i en) × bazy kluczy z docs/lokalizacja/oczekujace.json; kontekst z en.kontekst.json, słownik terminów, glosariusz jednostek.
# Płatny z kredytów API właściciela (Message Batches, −50%). Klucz: sekret repozytorium ANTHROPIC_API_KEY, użyty w JEDNYM kroku jako zmienna
# środowiskowa; skrypt nigdy go nie wypisuje. Słowniki NIE są zmieniane i nic nie jest zapisywane do repo — wynik to artefakt `raport-przekladu`
# (propozycje, 7 dni); nałożenie lokalnie po przeglądzie: node scripts/i18n/przeklad-zastosuj-delta.mjs <kod…>.
# Limit kosztu 30 USD na przebieg (P-481, wyjątek od P-144 = 6 USD, zgoda właściciela 2026-11-03); powyżej — stop bez zgoda_koszt=tak. Domyślnie tylko szacunek (tylko_szacuj=true), bez klucza.
# Uruchom z gałęzi roboczej („Use workflow from”); na main leży punkt startowy tej samej nazwy (P-472).
# Tryb `przeglad` (P-486, D-027): drugi przegląd AI fali w świeżym kontekście — Batch, ten sam model i wysiłek; recenzent na język dostaje en + kontekst + wycinek słownika + OBECNY tekst języka
# dla baz kluczy z docs/lokalizacja/zakres-fali-2026-11-03.json i zwraca TYLKO poprawki z powodem; wynik = artefakt `raport-przegladu` (<kod>.json), przyjęcie lokalnie:
# node scripts/i18n/przeklad-zastosuj-poprawki.mjs --raport <katalog artefaktu> <kod…>.
name: Przekład tłumaczeń (API, ręcznie)
on:
  workflow_dispatch:
    inputs:
      tryb:
        description: 'Tryb: przeklad (propozycje przekładu) albo przeglad (drugi przegląd AI — tylko poprawki obecnego przekładu)'
        type: choice
        default: przeklad
        options: [przeklad, przeglad]
      model:
        description: 'Model przekładu'
        type: choice
        default: opus
        options: [sonnet, opus]
      wysilek:
        description: 'Wysiłek modelu (output_config.effort); Opus 5.5 bez wartości = medium'
        type: choice
        default: high
        options: [low, medium, high, xhigh, max]
      limit:
        description: 'Tylko N pierwszych języków (puste = wszystkie 33); przebieg dowodowy: 2'
        type: string
        default: ''
      tylko_szacuj:
        description: 'Tylko szacunek kosztu, bez wysyłania niczego płatnego'
        type: boolean
        default: true
      zgoda_koszt:
        description: 'Zgoda na koszt powyżej 30 USD (tak / nie)'
        type: choice
        default: 'nie'
        options: ['nie', 'tak']
      wznow:
        description: 'Odbiór wyników wysłanego wcześniej batcha (identyfikator msgbatch_… z logu przebiegu); puste = nowy przekład'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: przeklad-tlumaczen
  cancel-in-progress: false
jobs:
  przeklad:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Szacunek kosztu bez klucza — stop powyżej 30 USD bez zgody
        env:
          WEJ_TRYB: ${{ inputs.tryb }}
          WEJ_MODEL: ${{ inputs.model }}
          WEJ_WYSILEK: ${{ inputs.wysilek }}
          WEJ_LIMIT: ${{ inputs.limit }}
          WEJ_ZGODA: ${{ inputs.zgoda_koszt }}
        run: |
          set -eu
          if [ "$WEJ_TRYB" = "przeglad" ]; then ZAKRES=docs/lokalizacja/zakres-fali-2026-11-03.json; WYJ=raport-przegladu; else ZAKRES=docs/lokalizacja/oczekujace.json; WYJ=raport-przekladu; fi
          ARGS=(--szacuj --tryb "$WEJ_TRYB" --model "$WEJ_MODEL" --wysilek "$WEJ_WYSILEK" --zakres "$ZAKRES" --pomin pl --wyjscie "$WYJ")
          if [ -n "$WEJ_LIMIT" ]; then ARGS+=(--limit "$WEJ_LIMIT"); fi
          if [ "$WEJ_ZGODA" = "tak" ]; then ARGS+=(--zgoda-koszt); fi
          node scripts/i18n/przeklad-api.mjs "${ARGS[@]}"
      - name: Przekład (szacunek dokładny lub batch)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEJ_TRYB: ${{ inputs.tryb }}
          WEJ_MODEL: ${{ inputs.model }}
          WEJ_WYSILEK: ${{ inputs.wysilek }}
          WEJ_LIMIT: ${{ inputs.limit }}
          WEJ_ZGODA: ${{ inputs.zgoda_koszt }}
          WEJ_SZACUJ: ${{ inputs.tylko_szacuj }}
          WEJ_WZNOW: ${{ inputs.wznow }}
        run: |
          set -eu
          if [ "$WEJ_TRYB" = "przeglad" ]; then ZAKRES=docs/lokalizacja/zakres-fali-2026-11-03.json; WYJ=raport-przegladu; else ZAKRES=docs/lokalizacja/oczekujace.json; WYJ=raport-przekladu; fi
          ARGS=(--tryb "$WEJ_TRYB" --model "$WEJ_MODEL" --wysilek "$WEJ_WYSILEK" --zakres "$ZAKRES" --pomin pl --wyjscie "$WYJ")
          if [ -n "$WEJ_LIMIT" ]; then ARGS+=(--limit "$WEJ_LIMIT"); fi
          if [ "$WEJ_ZGODA" = "tak" ]; then ARGS+=(--zgoda-koszt); fi
          if [ "$WEJ_SZACUJ" = "true" ]; then ARGS+=(--szacuj); fi
          if [ -n "$WEJ_WZNOW" ]; then
            [[ "$WEJ_WZNOW" =~ ^msgbatch_[A-Za-z0-9]+$ ]] || { echo "::error::wznow: oczekiwany identyfikator msgbatch_…"; exit 1; }
            ARGS+=(--wznow "$WEJ_WZNOW")
          fi
          node scripts/i18n/przeklad-api.mjs "${ARGS[@]}"
      - name: Podsumowanie w logu przebiegu
        if: always()
        env:
          WEJ_TRYB: ${{ inputs.tryb }}
        run: |
          if [ "$WEJ_TRYB" = "przeglad" ]; then WYJ=raport-przegladu; else WYJ=raport-przekladu; fi
          if [ -f "$WYJ/podsumowanie.md" ]; then cat "$WYJ/podsumowanie.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$WYJ/szacunek.json" ]; then node -e "const s=require('./$WYJ/szacunek.json');console.log('Szacunek ('+s.tryb+'): '+JSON.stringify(s.koszt_wg_modelu))" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Artefakt przekładu (tylko raporty, 7 dni)
        if: always() && inputs.tryb != 'przeglad'
        uses: actions/upload-artifact@v4
        with:
          name: raport-przekladu
          path: |
            raport-przekladu/*.json
            raport-przekladu/podsumowanie.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Artefakt przeglądu (tylko raporty, 7 dni)
        if: always() && inputs.tryb == 'przeglad'
        uses: actions/upload-artifact@v4
        with:
          name: raport-przegladu
          path: |
            raport-przegladu/*.json
            raport-przegladu/podsumowanie.md
          if-no-files-found: ignore
          retention-days: 7
