# Wgranie metadanych sklepu (nazwy, podtytuły, słowa kluczowe, opisy, teksty promocyjne, adresy; do 33 lokalizacji ASC) z repozytorium do App Store Connect
# przez API. Przeniesione z Treningu (P-315, P-316 (4); wzór: asc-metadane.yml, 2e4b0f8). Skrypt scripts/asc/metadane.mjs, dane docs/wydanie/metadane/*.store.json. Tylko ręcznie.
# tryb podglad (domyślny): tylko odczyt — pokazuje, co jest w ASC i w repo, bez zapisu. tryb zapis: tworzy brakujące i aktualizuje różniące się, NIGDY nie usuwa.
# Wejście `tylko` (kody ASC, np. en-US): zapis jednej lokalizacji — zasada Treningu: pierwszy zapis na jednym elemencie, sprawdzenie w usłudze, potem całość.
# Sekrety środowiska `release` jak w testflight.yml: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (bez nowych). Repozytorium jest publiczne: logi bez identyfikatorów klucza
# (maskowanie), klucz tylko w RUNNER_TEMP i usuwany zawsze.
# Różnice względem Treningu (nazwane): (1) jedno zadanie w środowisku `release` zamiast pary „podgląd bez środowiska” + „zapis w release” — sekrety
# Oczka są sekretami ŚRODOWISKA (strażnik scripts/jakosc/sprawdz-workflowy.mjs: SEKRET-BEZ-SRODOWISKA, ADR-0014), więc zadanie bez środowiska ich nie widzi;
# zatwierdzenie właściciela jest jedno na przebieg i obejmuje podgląd oraz zapis. (2) Działa dopiero po scaleniu do `main`: workflow_dispatch
# działa tylko z plikiem na gałęzi domyślnej (GitHub, „Events that trigger workflows”, odczyt 2026-11-01; P-319) — `main` nie ma tego pliku do czasu scalenia.
name: ASC metadane sklepu
on:
  workflow_dispatch:
    inputs:
      tryb:
        description: 'podglad = tylko odczyt i lista zmian; zapis = utwórz brakujące i zaktualizuj różniące się (nigdy nie usuwa)'
        type: choice
        options: [podglad, zapis]
        default: podglad
      tylko:
        description: 'Tylko te lokalizacje ASC, np. en-US albo en-US,en-GB (pusty = wszystkie; wszystkie wymagają kompletu pól)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: asc-metadane
  cancel-in-progress: false
jobs:
  metadane:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Klucz API do pliku tymczasowego (maskowany)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || { echo "::error::Brak sekretu $v w środowisku release (docs/wydanie/kroki-wlasciciela-testflight.md, A5)"; exit 1; }; done
          echo "::add-mask::$ASC_KEY_ID"; echo "::add-mask::$ASC_ISSUER_ID"
          printf '%s\n' "$ASC_KEY_P8" | while IFS= read -r line; do case "$line" in -----*) ;; *) [ ${#line} -ge 20 ] && echo "::add-mask::$line" ;; esac; done; true
          umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Podgląd (tylko odczyt)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TYLKO: ${{ inputs.tylko }}
        run: |
          set -o pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ARGS=(--podglad)
          [ -n "$TYLKO" ] && ARGS+=(--tylko "$TYLKO")
          node scripts/asc/metadane.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Zapis metadanych (nigdy nie usuwa)
        if: ${{ inputs.tryb == 'zapis' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TYLKO: ${{ inputs.tylko }}
        run: |
          set -o pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ARGS=(--zapis)
          [ -n "$TYLKO" ] && ARGS+=(--tylko "$TYLKO")
          node scripts/asc/metadane.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Usunięcie klucza z maszyny
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
