# PU-110 (G-04): „Show ›” przy „Vibration” i „Oczko Pro” otwiera Ustawienia (nie ekran zakupu), przy „Units” ekran „Units”; „Back” wraca do przewodnika; nic nie kupione, nie wyeksportowane, nie usunięte.
# Kod: trasy `/ustawienia` (f-wibracje, f-pro) i `/miary` (f-jednostki) w src/domena/przewodnik.ts; z „Dziś” (bez `?z=ustawienia`) to push (app/przewodnik.tsx:38-40).
# Nazwa funkcji „Vibration” = klucz `ustawienia.wibracje` (en.json), nie „Haptics”. Brak skutków ubocznych: `oferty-ekran` i `eksport-wynik` niewidoczne, `ustawienia-pro` bez „On”.
