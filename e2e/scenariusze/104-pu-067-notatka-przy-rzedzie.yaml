# PU-067 (T-38): notatka przy oznaczonym rzędzie wzoru — „Add note” → „k2tog here” → „Save” → chip „Row 1: k2tog here”, także po ponownym otwarciu wzoru.
# Kod: `wzor-zaznacz` → karta kierunku `wzor-kierunek` → pasek; „Add note” (`wzor.dodaj_notatke`, ikona bez testID — selektor po etykiecie) → arkusz z polem `wzor-notatka-pole`, „Save” (`wspolne.zapisz`);
# chip rysuje widok natywny (`WzorWidokNatywny.tsx:55`, etykieta `wzor.notatka_chip` „Row {n}: {tekst}”) → stuknięcie otwiera arkusz `wzor-notatka-tresc`, `wzor-notatka-zamknij` (`WzorNotatki.tsx`).
# Ograniczenia: BX-034 (`point`, jak 103); chip natywny — selektor po tekście (hipoteza: etykieta natywna jest w hierarchii Maestro iOS); „Save” przy klawiaturze (krok „Save” może być zasłonięty — do przebiegu iOS).
appId: com.apps4brew.knitting
name: "PU-067 · Notatka przy rzędzie: znacznik → „Add note” → „k2tog here” → „Row 1: k2tog here” także po ponownym otwarciu"
tags:
  - przypadki-uzycia
  - oczekujacy
  - PU-067
  - wzor
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-16T12:00:00"
- runFlow: subflows/projekt-roboczy.yaml
- runFlow: subflows/otworz-wzor-pdf.yaml
- tapOn: { id: "wzor-zaznacz" }
- assertVisible: { id: "wzor-kierunek" }
- tapOn: "Down, like written steps"
- assertVisible: { id: "wzor-znacznik-rzad", text: "1" }
# --- „stuknij inny rząd” przy otwartym pasku: pas przechodzi, rząd zostaje ---
- tapOn: { point: "50%, 55%" }
- assertVisible: { id: "wzor-znacznik-rzad", text: "1" }
- takeScreenshot: 104-znacznik
# --- notatka ---
- tapOn: "Add note"
- assertVisible: { id: "wzor-notatka-pole" }
- tapOn: { id: "wzor-notatka-pole" }
- inputText: "k2tog here"
- assertVisible: { id: "wzor-notatka-pole", text: "k2tog here" }
- tapOn: "Save"
- assertNotVisible: { id: "wzor-notatka-pole" }
- assertVisible: "Row 1: k2tog here"
- takeScreenshot: 104-chip
# --- stuknięcie w chip pokazuje treść notatki ---
- tapOn: "Row 1: k2tog here"
- assertVisible: { id: "wzor-notatka-tresc", text: "k2tog here" }
- tapOn: { id: "wzor-notatka-zamknij" }
- assertNotVisible: { id: "wzor-notatka-tresc" }
# --- zamknięcie i ponowne otwarcie wzoru: notatka nadal przy rzędzie ---
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "licznik-wzor" }, timeout: 30000 }
- scrollUntilVisible: { element: { id: "licznik-wzor" }, direction: DOWN, timeout: 30000 } # AX5: akcja pod liczbą bywa poza ekranem
- tapOn: { id: "licznik-wzor" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: "Row 1: k2tog here"
- takeScreenshot: 104-po-ponownym-otwarciu
