# NFR-DOS-001 (docs/brd/wymagania.md:97, 100% elementów PR-01–05): etykiety VoiceOver z design-spec („VoiceOver: komunikaty i zachowanie”, „Komponenty”).
# Maestro czyta drzewo dostępności iOS (accessibilityLabel) — scenariusz sprawdza etykiety; audyt performAccessibilityAudit to XCTest (kontrola 05-11),
# odbiór przez osobę: ryzyko szczątkowe. Etykieta zawiera widoczny tekst (WCAG 2.5.3).
appId: com.apps4brew.knitting
name: "NFR-DOS-001 · Etykiety VoiceOver na ekranie licznika, baneru, menu i historii"
tags:
  - NFR-DOS-001
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- assertVisible: "\\+1 row.*"
- assertVisible: "−1 row"
- assertVisible: "History"
- tapOn: "\\+1 row.*"
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertVisible: "Counter options.*" # menu ••• dopiero z projektem (design-spec:138; E2 fix-3); od p3a etykieta licznik.menu_wiecej_a11y (src/ekrany/Licznik.tsx:129), „Project options” to ••• ekranu projektu
- assertVisible: "\\+1 row, when row 2 is done.*"
# Restart zamiast odstępu (#145, P-489): okno strażnika serii (RD-17) 15 s zamiast 2 s, bo seria 3 stuknięć Maestro trwała 7 s na wolnej maszynie (wzór 04 i 12, E2E-A4);
# nowy proces nie pamięta pierwszego +1, więc nie wchodzi ono do serii (baner „Undo 3 rows”, nie 4) bez 15 s czekania. Licznik zostaje 1 (NFR-DAN-002).
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-10T19:31:00", OKNO: "15" } }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- tapOn: { id: "licznik-plus", repeat: 3, delay: 150 }
- assertVisible: { id: "licznik-wartosc", text: "4" }
- assertVisible: "Undo 3 rows"
- tapOn: "Undo 3 rows"
- assertVisible: { id: "licznik-wartosc", text: "1" }
- tapOn: "Counter options.*"
- assertVisible: "Lock counter \\(ignore taps\\)"
- tapOn: "Lock counter \\(ignore taps\\)"
- assertVisible: "Counter locked.*"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertVisible: "Counter is locked\\. Unlock it at the top\\."
- takeScreenshot: 29-zablokowany
- tapOn: { id: "pasek-blokady-odblokuj" }
- assertNotVisible: "Counter locked.*"
- tapOn: "History"
- assertVisible: { id: "historia-lista" }
- assertVisible: "Close"
- tapOn: "Close"
- assertVisible: { id: "licznik-wartosc", text: "1" }
