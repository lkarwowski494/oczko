# Podprzepływ: zabicie procesu i start na tych samych danych z zegarem TERAZ (bez sieci), zakończony w miejscu pracy.
# Po ZM-18 (P-563 (4a)) zimny start zawsze na „Dziś”; „Kontynuuj ›” wraca do projektu, części i licznika albo do strony wzoru w tym samym powiększeniu,
# a karta bez ostatniego miejsca (projekty są) ma „Wybierz projekt ›” → zakładka Projekty (dzis-bez-miejsca-*, P-564, P-565).
# Jedyne miejsce zmiany restartu dla scenariuszy, które po restarcie pracują w miejscu pracy (07-e2e, 2026-11-08): reszta kroków bez zmian.
# Parametr opcjonalny OKNO: okno strażnika serii (RD-17) w sekundach — przekazywany do restart-dzis.yaml (domyślnie "2", tests/jakosc/e2e-kruchosc-145.test.ts).
appId: com.apps4brew.knitting
name: "podprzepływ: restart na tych samych danych, przez „Dziś” do miejsca pracy"
---
- runFlow:
    file: restart-dzis.yaml
    env:
      TERAZ: ${TERAZ}
      OKNO: "${typeof OKNO === 'undefined' ? '2' : OKNO}"
- tapOn: { id: "dzis-kontynuuj|dzis-wybierz-projekt" }
# P-089 (3a): jednorazowe okno „Uczciwe zasady” — po zmianie startu nad zakładką Projekty („Wybierz projekt ›”), nigdy nad licznikiem; sprawdza je 07-p-089-3a-uczciwe-zasady.yaml
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|licznik-plus|limit-zawczasu|projekty-lista" }, timeout: 60000 }
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true }
- extendedWaitUntil: { visible: { id: "licznik-plus|limit-zawczasu|projekty-lista" }, timeout: 60000 }
