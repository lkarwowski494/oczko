# Podprzepływ (07-jakosc-033 A): z licznika → menu ••• → „Set a repeat length” → długość DLUGOSC → Save → arkusz zamknięty.
# Parametr (env runFlow): DLUGOSC — liczba rzędów powtórzenia jako tekst (np. "8").
# Pole długości ma testID `powtorzenie-dlugosc-pole` (src/ekrany/Formularze.tsx, 033-T1; wcześniej selektor po etykiecie „Rows in one repeat”).
# Skutek wpisu sprawdza scenariusz na liczniku (`licznik-powtorzenie`, tekst „repeat N · row R of D”).
appId: com.apps4brew.knitting
name: "podprzepływ: ustaw długość powtórzenia"
---
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-powtorzenie" }
- tapOn: { id: "menu-powtorzenie" }
- assertVisible: { id: "formularz-zapisz" }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "powtorzenie-dlugosc-pole" }
      - waitForAnimationToEnd
      - eraseText: 6
      - inputText: ${DLUGOSC}
      - assertVisible: { id: "formularz-zapisz" }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { notVisible: { id: "formularz-zapisz" }, timeout: 20000 }
