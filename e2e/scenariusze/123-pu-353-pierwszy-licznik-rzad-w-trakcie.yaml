# PU-353 (ZM-21, P-1090 (1), P-1101): świeża instalacja — karta „Pierwszy licznik” pokazuje 1 „current row”, po „+1” 2; licznik w znaczeniu „w trakcie”.
# Przeniesiony ze szkieletu TQ1 przez 08 (P-1114, FA1): kod zmienia znaczenie nowego licznika (ZM-21), tag `oczekujacy` do pierwszego zielonego przebiegu CI (zasada roli 07 nr 8).
appId: com.apps4brew.knitting
name: "PU-353 · Pierwszy licznik: karta 1 „current row”, po +1 2"
tags:
  - przypadki-uzycia
  - oczekujacy
  - PU-353
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty-dzis.yaml
    env:
      TERAZ: "2026-11-28T12:00:00"
- assertVisible: { id: "dzis-wartosc", text: "1" } # ekran: (zakladki)/index
- assertVisible: "current row"
- tapOn: { id: "dzis-plus" }
- assertVisible: { id: "dzis-wartosc", text: "2" }
- takeScreenshot: 124-pierwszy-licznik-w-trakcie
- tapOn: { id: "dzis-kontynuuj" }
- extendedWaitUntil: { visible: { id: "licznik-wartosc", text: "2" }, timeout: 20000 } # ekran: licznik
- tapOn: { id: "nav-wstecz" } # powrót: (zakladki)/index
- assertVisible: { id: "dzis-wartosc", text: "2" }
