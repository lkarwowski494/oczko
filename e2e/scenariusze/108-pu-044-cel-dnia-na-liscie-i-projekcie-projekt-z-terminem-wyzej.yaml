# PU-044 (T-32; opis poprawiony 16.11.2026 słowami właściciela, commit 22f5941f): po ustawieniu terminu cel dnia jest na liście „Projekty” w wierszu projektu („Today: 0 of 13 rows”)
# i na ekranie projektu („Done by Nov 4, today 0 of 13 rows”); karta „Dziś” celu dnia nie pokazuje (scope-contract:9); w „W toku” projekt z terminem stoi nad projektem bez terminu.
# Stan jak w 35 (BR-DNI-005/S1, wektor RD-15-W1): cel 320, 140 do wczoraj (21.10), dziś 22.10, termin 4.11 → cel na dziś 13. Drugi projekt „Vest” bez terminu, z +1 dziś (22.10):
# bez reguły BR-DNI-006 (src/dane/repozytoria/kalendarz.ts:115-117, ranga cel/bez terminu) wygrałby „Vest” (świeższa praca), więc kolejność wiersza 0/1 coś dowodzi.
# Kod: linia wiersza `projekty.dzis` (src/kompozycja/projekt.ts:26 → `termin` wiersza src/ekrany/ListaProjektow.tsx:62; tekst wiersza = `projekty-wiersz`, jak „Harbor.*” w 75);
# linia na ekranie projektu `projekt-linia-terminu` (src/ekrany/Projekt.tsx:138, jak 35); „Dziś” `dzis-karta` (src/ekrany/Dzis.tsx:111-117) nie niesie celu dnia.
# Powrót: projekt → `nav-wstecz` → licznik → `nav-wstecz` → „Dziś” → zakładka `nav-projekty` (P-583, jak 72/75). Wybór daty: jak 35 (etykieta komórki UIDatePicker iOS 26 — do przebiegu iOS).
# Wartość 140 i restart z zegarem 22.10: jak 35. Pakiet pełny.
appId: com.apps4brew.knitting
name: "PU-044 · Termin 4 XI: cel dnia „Today: 0 of 13 rows” w wierszu listy i „Done by …” na projekcie, nie na „Dziś”; projekt z terminem nad „Vest” bez terminu"
tags:
  - przypadki-uzycia
  - oczekujacy
  - PU-044
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-10-21T19:30:00"
- runFlow: subflows/projekt-roboczy.yaml
- runFlow: subflows/nazwij-projekt.yaml
- runFlow: { file: subflows/dodaj-czesc-cel.yaml, env: { CEL: "320" } }
- runFlow: { file: subflows/wpisz-wartosc.yaml, env: { WARTOSC: "140" } }
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-10-22T19:30:00" } }
- assertVisible: { id: "licznik-wartosc", text: "140" }
# --- termin 4 listopada (jak 35) ---
- tapOn: { id: "licznik-projekt-wejscie" }
- scrollUntilVisible: { element: { id: "projekt-termin" } }
- assertVisible: { id: "projekt-termin" }
- tapOn: { id: "projekt-termin" }
- assertVisible: { id: "formularz-termin-data" }
- tapOn: "Next Month"
- assertVisible: ".*November 2026.*"
- tapOn: ".*November 4.*"
- assertVisible: "Today’s goal: 13 rows. It stays the same all day."
- tapOn: { id: "formularz-zapisz" }
# --- 1. ekran projektu: linia terminu z celem dnia ---
- scrollUntilVisible: { element: { id: "projekt-linia-terminu" }, direction: UP }
- assertVisible: { id: "projekt-linia-terminu", text: "Done by Nov 4, today 0 of 13 rows" }
- takeScreenshot: 108-projekt-linia-terminu
# --- 2. „Dziś”: karta bez celu dnia ---
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "dzis-karta" }, timeout: 20000 }
- assertNotVisible: ".*of 13 rows.*"
- assertNotVisible: ".*Done by.*"
- takeScreenshot: 108-dzis-bez-celu-dnia
- assertVisible: { id: "nav-projekty" } # „Dziś” ma zakładki; z licznika zakładki nie ma (P-583)
# --- 3. lista „Projekty”: wiersz z terminem niesie cel dnia ---
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|projekty-lista" }, timeout: 30000 }
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true }
- extendedWaitUntil: { visible: { id: "projekty-lista" }, timeout: 30000 }
- assertVisible: { id: "projekty-wiersz", index: 0, text: "Harbor.*" }
- assertVisible: { id: "projekty-wiersz", index: 0, text: ".*Today: 0 of 13 rows.*" }
- assertNotVisible: { id: "projekty-wiersz", index: 1 }
- takeScreenshot: 108-lista-cel-dnia
# --- 4. drugi projekt „Vest” bez terminu, z pracą dziś: kolejność wg terminu, nie wg ostatniej pracy ---
- tapOn: { id: "projekty-nowy" }
- extendedWaitUntil: { visible: { id: "formularz-nazwa-projektu" }, timeout: 20000 }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "formularz-nazwa-projektu" }
      - waitForAnimationToEnd
      - eraseText: 20
      - inputText: "V"
      - inputText: "e"
      - inputText: "s"
      - inputText: "t"
      - assertVisible: { id: "formularz-nazwa-projektu", text: "Vest" }
- pressKey: Enter
- assertVisible: { id: "formularz-zapisz" }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- assertVisible: { id: "licznik-projekt", text: "Vest" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "nav-projekty" }, timeout: 20000 }
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "projekty-lista" }, timeout: 30000 }
- assertVisible: { id: "projekty-wiersz", index: 0, text: "Harbor.*" }
- assertVisible: { id: "projekty-wiersz", index: 0, text: ".*Today: 0 of 13 rows.*" }
- assertVisible: { id: "projekty-wiersz", index: 1, text: "Vest.*" }
- assertNotVisible: { id: "projekty-wiersz", index: 1, text: ".*Today:.*" }
- assertNotVisible: { id: "projekty-wiersz", index: 2 }
- takeScreenshot: 108-lista-termin-nad-bez-terminu
