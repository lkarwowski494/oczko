# BR-DAN-008/S1 (docs/brd/wymagania-dane.md:117): usunięty projekt przywrócony po 29 dniach wraca ze wszystkimi danymi (P-026, okres 30 dni).
# Usuwanie: ekran projektu → ••• → „Delete project…” → alert systemowy („Delete project”); wejście do kosza: ostatni wiersz listy „Recently deleted”
# (P-183 (2a), tylko przy niepustym koszu). Wyrocznia: BRD S1 + P-026 (29 dni < 30). Ścieżka utraty danych (S1) — w `podstawowy` (bramka TestFlight)
# od DEC-08 (a) (P-198 Q3a, P-418, P-430; M1-audytor-generalny-047).
appId: com.apps4brew.knitting
name: "BR-DAN-008/S1 · Usunięty projekt po 29 dniach: Restore przywraca nazwę i 1 rząd"
tags:
  - BR-DAN-008-S1
  - podstawowy
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-01T19:30:00"
- runFlow: subflows/projekt-roboczy.yaml
- runFlow: subflows/nazwij-projekt.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- tapOn: { id: "licznik-projekt-wejscie" }
- assertVisible: { id: "projekt-menu" }
- tapOn: { id: "projekt-menu" }
- assertVisible: { id: "projekt-usun" }
- takeScreenshot: 36-menu-usuwania
- tapOn: { id: "projekt-usun" }
- assertVisible: "Delete “Harbor”\\?"
- takeScreenshot: 36-potwierdzenie
- tapOn: "Delete project"
- extendedWaitUntil: { visible: { id: "projekty-lista" }, timeout: 20000 }
- assertNotVisible: "Harbor.*last worked.*"
- assertVisible: { id: "projekty-kosz" }
# --- 29 dni później (P-026: 30 dni w koszu) ---
# zimny start na „Dziś”; „Kontynuuj ›” prowadzi do ostatniego licznika (przebieg 42544112861 step-076: „Counter” 0), więc do listy zakładką z „Dziś” (P-608 G1)
- runFlow: { file: subflows/restart-dzis.yaml, env: { TERAZ: "2026-11-30T19:30:00" } }
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|projekty-lista|projekty-kosz|projekty-dni-darmowe" }, timeout: 30000 }
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady" }, timeout: 5000, optional: true } # okno otwiera się po wyrenderowaniu listy (efekt `pokazacOknoUczciweZasady`)
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true } # okno „Uczciwe zasady” to trasa modalna NAD listą: do zamknięcia lista nie jest w hierarchii (BR-ZAK-006/S9, 07-jakosc-022; E2-137-S1)
- extendedWaitUntil: { visible: { id: "projekty-lista|projekty-kosz|projekty-dni-darmowe" }, timeout: 30000 }
- assertVisible: { id: "projekty-kosz" }
- tapOn: { id: "projekty-kosz" }
- assertVisible: { id: "kosz-lista" }
- assertVisible: "Harbor.*"
- takeScreenshot: 36-kosz
- tapOn: { id: "kosz-przywroc", index: 0 }
- assertNotVisible: { id: "kosz-przywroc" }
- takeScreenshot: 36-kosz-po-przywroceniu
- tapOn: { id: "nav-wstecz" }
- assertVisible: { id: "projekty-lista" }
- assertNotVisible: { id: "projekty-kosz" }
- takeScreenshot: 36-lista-po-przywroceniu
- tapOn: "Harbor.*"
- assertVisible: { id: "licznik-projekt", text: "Harbor" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
