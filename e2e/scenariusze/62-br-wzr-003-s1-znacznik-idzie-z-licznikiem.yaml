# BR-WZR-003 S1+S2+S6 (docs/brd/wymagania-projekt.md:252, RD-21-W1, RD-21-W4, F-26, 07-jakosc-033): znacznik rzędu na wzorze.
# Licznik 11 (tryb „skończone rzędy”) → „Mark row” proponuje rząd 12 (S2, RD-21-W1) → po +1 licznik 12, a znacznik stoi na rzędzie 13 (S1, RD-21-W4)
# → po restarcie znacznik nadal na 13 (S6 „Powrót do wzoru”; start na ekranie wzoru: BR-PRJ-011/S1, jak scenariusz 26).
# Wynik widoczny dla użytkownika to rząd w pasku ustawiania znacznika (`wzor-znacznik-rzad`, krokowiec); sam pas rysuje widok natywny (`oczko-wzor`)
# i jego położenia Maestro nie czyta — przesunięcie pasa na zrzucie (62-znacznik-13) i na urządzeniu (lista telefonu). Pasek otwiera „Mark row” (`wzor-zaznacz`, 033-T1;
# wcześniej selektor po etykiecie VoiceOver „Mark row”) — druga „Mark row” z istniejącym znacznikiem zachowuje jego rząd (`rzadPoPrzeniesieniu`, znacznik-wzoru.ts:59).
# Poza scenariuszem: S3 (schemat od innego rzędu), S4 (prucie przed schemat), S5 (notatka na znaczniku) — Jest `tests/domena/wzor/rd21.test.ts`, `wzor-trasa-znacznik`;
# koniec strony („Place on page 2”) i przytrzymanie w rzędzie (S3 BR-WZR-003 minimum) — gest na PDF, nie sprawdzany tu. Informacyjnie do pierwszego zielonego (P-091).
appId: com.apps4brew.knitting
name: "BR-WZR-003/S1 · Znacznik rzędu: licznik 11 → rząd 12, po +1 licznik 12 i znacznik na rzędzie 13, po restarcie bez zmian"
tags:
  - BR-WZR-003-S1
  - wzor
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-12T19:30:00"
- runFlow: subflows/projekt-roboczy.yaml
# licznik 11: wpisanie wartości z menu ••• (wzór scenariusza 35: pole liczbowe, wpis znak po znaku, zapis przyciskiem arkusza)
- tapOn: { id: "licznik-menu" }
- assertVisible: { id: "menu-wpisz-wartosc" }
# NOC-2 (04): menu ••• otwarte (to samo, z którego podprzepływ otworz-wzor-pdf stuka „Pattern”)
- takeScreenshot: 62-menu-przed-wzorem
- tapOn: { id: "menu-wpisz-wartosc" }
- assertVisible: { id: "wpisz-wartosc-pole" }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "wpisz-wartosc-pole" }
      - waitForAnimationToEnd
      - eraseText: 6
      - inputText: "1"
      - inputText: "1"
      - assertVisible: { id: "wpisz-wartosc-pole", text: "11" }
- tapOn: { id: "formularz-zapisz" }
- assertVisible: { id: "licznik-wartosc", text: "11" }
- runFlow: subflows/otworz-wzor-pdf.yaml
- assertVisible: { id: "licznik-wartosc", text: "11" }
# NOC-2 (04): widok wzoru przed pierwszym znacznikiem
- takeScreenshot: 62-wzor-przed-znacznikiem
# --- „Mark row”: pierwszy znacznik pyta o kierunek rzędów (P-126 3a), potem proponuje rząd w robocie 12 ---
- tapOn: { id: "wzor-zaznacz" }
- assertVisible: { id: "wzor-kierunek" }
# NOC-2b (F-26, 04): pytanie o kierunek rzędów przed wyborem
- takeScreenshot: 62-wybor-kierunku
- tapOn: "Down, like written steps"
- assertVisible: { id: "wzor-znacznik-rzad", text: "12" }
- assertVisible: { id: "wzor-znacznik-pasek" }
- takeScreenshot: 62-znacznik-12
- tapOn: { id: "wzor-znacznik-gotowe" }
- assertNotVisible: { id: "wzor-znacznik-pasek" }
# NOC-2b (F-26, 04): stan po „Done”, panel zamknięty
- takeScreenshot: 62-wzor-po-gotowe
# --- użytkownik kończy rząd: licznik 12, znacznik przesuwa się na rząd 13 ---
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "12" }
# NOC-2 (04): widok wzoru po +1, panel znacznika zamknięty
- takeScreenshot: 62-wzor-po-plus-1-panel-zamkniety
- tapOn: { id: "wzor-zaznacz" }
- assertVisible: { id: "wzor-znacznik-rzad", text: "13" }
- takeScreenshot: 62-znacznik-13
- tapOn: { id: "wzor-znacznik-gotowe" }
- assertNotVisible: { id: "wzor-znacznik-pasek" }
# --- S6: restart; start otwiera ekran wzoru, znacznik nadal na rzędzie 13 ---
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-12T20:30:00" } }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- assertVisible: { id: "licznik-wartosc", text: "12" }
- tapOn: { id: "wzor-zaznacz" }
- assertVisible: { id: "wzor-znacznik-rzad", text: "13" }
- takeScreenshot: 62-po-restarcie
