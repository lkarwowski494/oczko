# BR-LIC-004/S4 (docs/brd/wymagania-licznik.md:67, ER-24): gest systemowy od dolnej krawędzi nad strefą +1 (≥ 168 pt) nie dodaje rzędu.
# Gestu systemowego nie da się wiernie odtworzyć (ryzyko szczątkowe); test zastępczy z kryterium: przeciągnięcie z dolnej krawędzi strefy +1 (R-011).
appId: com.apps4brew.knitting
name: "BR-LIC-004/S4 · Przeciągnięcie od dolnej krawędzi nad strefą +1 nie dodaje rzędu"
tags:
  - BR-LIC-004-S4
  - R-011
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: subflows/odstep.yaml
- swipe: { start: "50%, 99%", end: "50%, 55%", duration: 400 }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- swipe: { start: "20%, 98%", end: "80%, 98%", duration: 300 }
# P-608 G3: przebieg 42544112861 step-024 — po poziomym geście przy wskaźniku Home zrzut pokazał „Today” (prawdopodobnie migawka przełącznika aplikacji), a hierarchia licznik z 1;
# asercja natychmiast po geście trafiła w animację systemu. Czekamy, aż licznik wróci na wierzch — dodatkowy rząd nadal daje czerwień (wartość 2 ≠ 1).
- extendedWaitUntil: { visible: { id: "licznik-wartosc", text: "1" }, timeout: 15000 }
- takeScreenshot: 14-po-gestach
# --- zwykłe stuknięcie nadal działa ---
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
