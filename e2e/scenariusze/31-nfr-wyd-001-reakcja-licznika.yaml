# NFR-WYD-001 (docs/brd/wymagania.md:105): reakcja licznika. Budżet P-456 (M1-062): p95 ≤ 100 ms z 20 stuknięć w stanie ustalonym; pierwsze stuknięcie informacyjnie.
# Build E2E zapisuje czas od dotyku do wyrenderowania nowej wartości (e2e-pomiar-plus: „p95 … ms, n = 20 · first … ms”); 21 stuknięć: pierwsze osobno, 20 do p95;
# twarda asercja budżetu na końcu; wynik z zrzutu i logu trafia do artefaktu. Stuknięcia z odstępem > 2 s (bez banera serii RD-17).
appId: com.apps4brew.knitting
name: "NFR-WYD-001 · Reakcja licznika: p95 z 20 stuknięć ≤ 100 ms (P-456)"
tags:
  - NFR-WYD-001
  - pomiar
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "3" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "4" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "5" }
- runFlow:
    file: subflows/pomiar-pieciu.yaml
    env: { OD: "6" }
- runFlow:
    file: subflows/pomiar-pieciu.yaml
    env: { OD: "11" }
- runFlow:
    file: subflows/pomiar-pieciu.yaml
    env: { OD: "16" }
- assertVisible: { id: "licznik-wartosc", text: "20" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "21" }
- assertVisible: { id: "e2e-pomiar-plus", text: "p95 ([0-9]|[1-9][0-9]|100) ms, n = 20 · first [0-9]+ ms" }
- takeScreenshot: 31-pomiar
