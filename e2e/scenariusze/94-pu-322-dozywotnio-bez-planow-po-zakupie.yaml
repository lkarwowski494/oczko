# PU-322 (Pro, T-?): „Lifetime” kupione raz na sztucznym sklepie: plan „… once” z „Pay once. Nothing renews.”, po zakupie brak planów i brak „Manage subscription”, po restarcie Pro „On”.
# Kod: plany `oferty-plan-*` i `oferty-stan-pro` (src/ekrany/Oferty.tsx), „Manage subscription” `ustawienia-subskrypcja` tylko przy trwającej subskrypcji (src/ekrany/Ustawienia.tsx:101, `trwaSubskrypcja`), wartość „On” `ustawienia-pro` (Ustawienia.tsx:100).
# Nie sprawdzone (BX-025): zdanie PU „`e2e-sklep-wygas` nie wyłącza Pro” — scen. 06 (zielony, podstawowy) zakłada odwrotnie: po zakupie „Lifetime” i `e2e-sklep-wygas` znika `oferty-stan-pro`.
# Scenariusz sprawdza resztę wyniku. Wzór: scen. 06.
appId: com.apps4brew.knitting
name: "PU-322 · „Lifetime” na sztucznym sklepie: „Pay once. Nothing renews.”, po zakupie brak planów i „Manage subscription”, po restarcie Pro „On”"
tags:
  - przypadki-uzycia
  - oczekujacy
  - PU-322
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-12T19:30:00"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: subflows/otworz-ustawienia.yaml
- tapOn: { id: "ustawienia-oczko-pro" }
- extendedWaitUntil: { visible: { id: "oferty-ekran" }, timeout: 20000 }
- scrollUntilVisible: { element: { id: "oferty-plan-dozywotni" }, direction: DOWN, timeout: 30000, centerElement: true }
- assertVisible: { id: "oferty-plan-dozywotni", text: "Lifetime · .+ once\\. Pay once\\. Nothing renews\\." }
- takeScreenshot: 94-plan-dozywotni
- tapOn: { id: "oferty-plan-dozywotni" }
- assertVisible: { id: "oferty-plan-dozywotni", selected: true }
- tapOn: { id: "oferty-kup" }
- extendedWaitUntil: { visible: { id: "oferty-stan-pro" }, timeout: 20000 }
- assertNotVisible: { id: "oferty-plan-dozywotni" }
- assertNotVisible: { id: "oferty-plan-roczny" }
- assertNotVisible: { id: "oferty-plan-miesieczny" }
- takeScreenshot: 94-po-zakupie
- tapOn: { id: "oferty-nie-teraz" } # jak scen. 06 (P-608 G3): „Close” po przewinięciu leży nad arkuszem
- extendedWaitUntil: { visible: { id: "ustawienia-oczko-pro" }, timeout: 20000 }
- assertVisible: { id: "ustawienia-pro", text: "On" }
- assertNotVisible: { id: "ustawienia-subskrypcja" } # „Manage subscription” tylko przy subskrypcji, nie przy zakupie jednorazowym
- runFlow:
    file: subflows/restart.yaml
    env:
      TERAZ: "2026-11-12T19:50:00"
- runFlow: subflows/otworz-ustawienia.yaml
- assertVisible: { id: "ustawienia-pro", text: "On" }
- assertNotVisible: { id: "ustawienia-dni-darmowe" }
- assertNotVisible: { id: "ustawienia-subskrypcja" }
- takeScreenshot: 94-po-restarcie
