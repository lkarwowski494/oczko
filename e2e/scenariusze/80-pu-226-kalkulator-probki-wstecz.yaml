# PU-226 (docs/jakosc/przypadki-uzycia.md, „Nawigacja”): wejście i powrót — kalkulator próbki z „Tools” i z ekranu projektu („Swatch”); „‹” wraca tam, skąd wszedł.
# testID z kodu: `nav-narzedzia` app/(zakladki)/_layout.tsx:17; `narzedzia-probka` src/ekrany/Narzedzia.tsx:63 (→ `/probka` app/(zakladki)/narzedzia.tsx:26);
# kalkulator: pole `probka-oczka` Narzedzia.tsx:98, „Back” `nav-wstecz` Narzedzia.tsx:94 (`router.back()` app/probka.tsx:56); z projektu: `licznik-projekt-wejscie`
# src/ekrany/Licznik.tsx:158, wiersz „Swatch” `projekt-probka` src/ekrany/Projekt.tsx:225 (→ `/probka?projekt=…` app/projekt/[id].tsx:170), `projekt-dodaj` Projekt.tsx:120.
# Linia „z projektu” (en.json probka.z_projektu) tylko przy wejściu z projektu — tu bez asercji tekstu, wystarczy pole i powrót.
# Zielony w przebiegu „Jakość · iOS” 43752186631 (15.11.2026, SHA 8f0c1424): tag oczekujacy zdjęty, scenariusz podstawowy (P-834, BX6). Częściowo: 41-br-kal-003-s1-probka-w-calach.yaml.
appId: com.apps4brew.knitting
name: "PU-226 · Kalkulator próbki: z „Tools” i z „Swatch” ekranu projektu; „‹” wraca tam, skąd wszedł"
tags:
  - przypadki-uzycia
  - PU-226
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-12T19:30:00"
- runFlow: subflows/projekt-roboczy.yaml
# --- 1. z ekranu projektu: „Swatch” → kalkulator → „‹” do projektu ---
- tapOn: { id: "licznik-projekt-wejscie" }
- extendedWaitUntil: { visible: { id: "projekt-dodaj" }, timeout: 20000 }
- scrollUntilVisible: { element: { id: "projekt-probka" }, direction: DOWN, timeout: 30000, centerElement: true }
- tapOn: { id: "projekt-probka" }
- extendedWaitUntil: { visible: { id: "probka-oczka" }, timeout: 20000 }
- assertVisible: "Swatch"
- takeScreenshot: 80-probka-z-projektu
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { notVisible: { id: "probka-oczka" }, timeout: 20000 }
- assertVisible: { id: "projekt-probka" }
- scrollUntilVisible: { element: { id: "projekt-dodaj" }, direction: UP, timeout: 30000 }
- assertVisible: { id: "projekt-dodaj" }
- takeScreenshot: 80-powrot-do-projektu
# --- 2. z „Tools”: projekt → licznik → „Dziś” → zakładka Narzędzia → kalkulator → „‹” do „Tools” ---
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "nav-narzedzia" }, timeout: 20000 }
- tapOn: { id: "nav-narzedzia" }
- extendedWaitUntil: { visible: { id: "narzedzia-probka" }, timeout: 20000 }
- tapOn: { id: "narzedzia-probka" }
- extendedWaitUntil: { visible: { id: "probka-oczka" }, timeout: 20000 }
- assertVisible: "Swatch"
- takeScreenshot: 80-probka-z-narzedzi
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { notVisible: { id: "probka-oczka" }, timeout: 20000 }
- assertVisible: { id: "narzedzia-probka" }
- assertVisible: { id: "narzedzia-druty" }
- takeScreenshot: 80-powrot-do-narzedzi
