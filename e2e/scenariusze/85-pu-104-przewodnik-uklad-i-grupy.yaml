# PU-104 (docs/jakosc/przypadki-uzycia.md, „Przewodnik”, G-01): „Guide” na „Dziś” → przewodnik: układ, „Pierwsze kroki” (6 z „Show ›”), „Read: 0 of 42”, 9 grup.
# testID z kodu: wejście `nav-przewodnik` src/ekrany/Dzis.tsx:178; ekran `przewodnik` src/ekrany/Przewodnik.tsx:74, „Back” :75, kroki `przewodnik-krok-{1..6}[-pokaz]` :85/:89,
# postęp `przewodnik-postep` :98, grupy `przewodnik-grupa-{id}` :102 (id z src/domena/przewodnik.ts: dzis, licznik, projekty, wzor, narzedzia, historia, ustawienia, pro, poza).
# Nie sprawdzone scenariuszem (BX-021): widoczny napis „‹ Today” przy „Back” — etykieta dostępności przycisku to „Back” (src/ekrany/Pasek.tsx:29), Maestro iOS widzi etykietę, nie tekst
# dziecka; „bez wyszukiwania” — brak elementu bez testID nie ma selektora. Układ „?” przed zębatką: kolejność poziomą sprawdza test komponentowy tests/ekrany/przewodnik.test.tsx:141-152 (scen. 69 i 82 sprawdzają tylko obecność obu przycisków; CE-08).
appId: com.apps4brew.knitting
name: "PU-104 · Przewodnik z „Dziś”: bez paska zakładek, „Back”, „First steps” z 6 krokami i „Show”, „Read: 0 of 42”, 9 grup"
tags:
  - przypadki-uzycia
  - PU-104
---
- runFlow:
    file: subflows/start-czysty-dzis.yaml
    env:
      TERAZ: "2026-11-12T19:30:00"
- assertVisible: { id: "nav-przewodnik", text: "Guide" }
