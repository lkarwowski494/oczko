# P-190 (F-36, P-141 jak Trening): wybór języka w Ustawieniach jest trwały — po zabiciu procesu ten sam wybór; „Same as phone” wraca do automatu.
# Sprawdzany jest zapisany wybór (etykieta wybranej opcji ze słownika pl: „Polski, wybrano”; po przełączeniu na „Same as phone” wraca angielskie „…, selected”).
appId: com.apps4brew.knitting
name: "P-190 · Język Polski zapamiętany po restarcie; ‘Same as phone’ przywraca automat"
tags:
  - P-190
  - PU-233
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- runFlow: subflows/otworz-ustawienia.yaml
- scrollUntilVisible: { element: { id: "ustawienia-jezyk" } }
- tapOn: { id: "ustawienia-jezyk" }
- assertVisible: { id: "jezyk-auto", text: "Same as phone, selected" }
- scrollUntilVisible: { element: { id: "jezyk-pl" } }
- tapOn: { id: "jezyk-pl" }
- assertVisible: { id: "ustawienia-jezyk", text: ".*Polski.*" } # wybór działa od razu i wraca do Ustawień (src/ekrany/Jezyk.tsx:3, app/jezyk.tsx:17; przebieg 40457386369)
- takeScreenshot: 39-polski
- runFlow: { file: subflows/restart.yaml, env: { TERAZ: "2026-11-10T19:40:00" } }
- runFlow: subflows/otworz-ustawienia.yaml
- scrollUntilVisible: { element: { id: "ustawienia-jezyk" } }
- scroll # BX-010: scrollUntilVisible kończy, gdy ramka wiersza mieści się na ekranie, a środek wiersza leży jeszcze poza ScrollView (dolne wcięcie: ustawienia [0,62][402,840], wiersz [20,823][382,867], przebieg 43774048947 krok 62); jeszcze jedno przewinięcie do końca listy
- waitForAnimationToEnd # BX-010: wytracanie ruchu po przewinięciu przed stuknięciem
- tapOn: { id: "ustawienia-jezyk", retryTapIfNoChange: true }
- extendedWaitUntil: { visible: { id: "jezyk" }, timeout: 20000 } # ekran Język otwarty, zanim zacznie się szukanie wiersza
- scrollUntilVisible: { element: { id: "jezyk-pl" } }
- assertVisible: { id: "jezyk-pl", text: "Polski, wybrano" } # etykieta ze słownika pl (jezyk.wybrany_a11y); przebieg 41361451580: „Polski, wybrano” zamiast „Polski, selected” (E2-K1)
- scrollUntilVisible: { element: { id: "jezyk-auto" }, direction: UP }
- tapOn: { id: "jezyk-auto" }
- assertVisible: { id: "ustawienia" }
- scrollUntilVisible: { element: { id: "ustawienia-jezyk" } }
- scroll # BX-010 (jak wyżej)
- waitForAnimationToEnd # BX-010 (jak wyżej)
- tapOn: { id: "ustawienia-jezyk", retryTapIfNoChange: true }
- assertVisible: { id: "jezyk-auto", text: "Same as phone, selected" }
