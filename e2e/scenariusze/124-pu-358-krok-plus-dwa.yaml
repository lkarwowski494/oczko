# PU-358 (ZM-24, ADR-0036, P-1102): licznik z krokiem +2 — „Dodaj licznik” → „Krok” „+2” → „+2” dodaje 2, −1 odejmuje 1, jedno „Cofnij” cofa +2.
# Przeniesiony ze szkieletu TQ1 przez 08 (P-1114, FA2): kod dodaje pole „Krok” (`dodaj-licznik-krok-2`) i przycisk „+2”; tag `oczekujacy` do pierwszego zielonego przebiegu CI (zasada roli 07 nr 8).
appId: com.apps4brew.knitting
name: "PU-358 · Krok +2: „+2” dodaje dwa rzędy, −1 odejmuje jeden, „Cofnij” cofa całe „+2”"
tags:
  - przypadki-uzycia
  - oczekujacy
  - PU-358
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-28T12:00:00"
- runFlow: subflows/projekt-roboczy.yaml
- runFlow: { file: subflows/wpisz-wartosc.yaml, env: { WARTOSC: "42" } }
- tapOn: { id: "licznik-projekt-wejscie" }
- extendedWaitUntil: { visible: { id: "projekt-dodaj" }, timeout: 60000 }
- tapOn: { id: "projekt-dodaj" }
- assertVisible: { id: "projekt-dodaj-licznik" }
- tapOn: { id: "projekt-dodaj-licznik" }
- assertVisible: { id: "formularz-nazwa-licznika" }
- tapOn: { id: "formularz-nazwa-licznika" }
- inputText: "Step two"
- assertVisible: "Step two"
- tapOn: { id: "dodaj-licznik-krok-2" } # ekran: formularz/[rodzaj]
- assertVisible: { id: "dodaj-licznik-krok-2", selected: true }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { visible: { id: "projekt-dodaj" }, timeout: 20000 }
- tapOn: "Step two.*"
- extendedWaitUntil: { visible: { id: "licznik-plus", text: ".*\\+2.*" }, timeout: 20000 } # ekran: licznik
- assertVisible: { id: "licznik-wartosc", text: "0" }
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- runFlow: subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "4" }
- tapOn: { id: "licznik-minus" }
- assertVisible: { id: "licznik-wartosc", text: "3" }
- takeScreenshot: 124-krok-plus-dwa
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "5" }
- scrollUntilVisible: { element: { id: "licznik-historia" }, direction: DOWN, timeout: 30000 } # AX5 i mały ekran: rząd akcji pod notatką bywa poza ekranem (testid.md:158)
- tapOn: { id: "licznik-historia" } # ekran: historia
- extendedWaitUntil: { visible: "3 → 5", timeout: 20000 } # jeden wpis „+2” na stuknięcie (P-1111 (3))
- tapOn: { id: "historia-cofnij-ostatnia" }
- assertNotVisible: "3 → 5"
- tapOn: { id: "arkusz-zamknij" } # powrót: licznik
- assertVisible: { id: "licznik-wartosc", text: "3" }
