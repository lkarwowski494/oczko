# BR-LIC-001/S2 (docs/brd/wymagania-licznik.md:12–15 po ER-68, ZM-18): pierwszy rząd jednym stuknięciem w „+1” karty „Pierwszy licznik”, bez sieci;
# karta pokazuje 1 bez zmiany ekranu, a rząd jest zapisany jak +1 na liczniku (to samo zdarzenie: ten sam licznik po „Otwórz licznik ›” i po restarcie);
# i odwrotnie: +1 na liczniku widać na karcie po „wstecz” (M1 240).
# Wyrocznia: NFR-PIE-001, L-01, Z-01. Ryzyko R-001: wartość po zabiciu procesu (COMMIT przed haptyką).
appId: com.apps4brew.knitting
name: "BR-LIC-001/S2 · Pierwszy rząd jednym stuknięciem w +1 karty (offline, ten sam zapis co licznik, trwały po zabiciu)"
tags:
  - BR-LIC-001-S2
  - podstawowy
  - stan-licznika
---
- runFlow:
    file: subflows/start-czysty-dzis.yaml
    env:
      TERAZ: "2026-11-10T19:30:00"
- assertVisible: { id: "dzis-wartosc", text: "0" }
- tapOn: { id: "dzis-plus" }
- assertVisible: { id: "dzis-wartosc", text: "1" }
- assertVisible: { id: "dzis-karta" } # bez zmiany ekranu
- takeScreenshot: 03-pierwszy-rzad-z-karty
# --- ten sam zapis co +1 licznika: licznik pokazuje rząd z karty ---
- tapOn: { id: "dzis-kontynuuj" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- assertVisible: { id: "licznik-teraz-rzad", text: ".*row 2" } # testid.md:159: na makiecie TO BE linia łączy się z podpisem liczby („rzędy gotowe · teraz rząd N”), tekst en od 04 — asercja numeru rzędu, nie brzmienia
# P-176 (a): tekst z design-spec „Element firmowy” (klucz licznik.znaczniki_sesji), godzina w formacie regionu symulatora — zmiana 08 jako nazwany wyjątek od kontraktu 07 (audyt 07).
- assertVisible: { id: "kreski-podpis", text: "Marks this session: 1 row since .*" }
- takeScreenshot: 03-licznik-po-karcie
# --- i odwrotnie (M1 240, P1, P-627): +1 na liczniku, „wstecz” → karta „Dziś” pokazuje bieżącą wartość, bez restartu (ekran zakładki zostaje
# zamontowany pod licznikiem, więc musi odświeżyć się przy powrocie). Czerwone do poprawki 240 (08: odświeżanie „Dziś” przy fokusie).
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "dzis-karta" }, timeout: 20000 }
- assertVisible: { id: "dzis-wartosc", text: "2" }
- takeScreenshot: 03-dzis-po-powrocie
- runFlow:
    file: subflows/restart.yaml
    env:
      TERAZ: "2026-11-10T19:31:00"
- assertVisible: { id: "licznik-wartosc", text: "2" }
- takeScreenshot: 03-po-restarcie
