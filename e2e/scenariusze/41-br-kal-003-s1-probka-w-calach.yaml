# BR-KAL-003/S1 (docs/brd/wymagania-narzedzia.md:114, ER-62): 20 o. na 4 in → 19,7 o./10 cm (pełna 19,685… z RD-04-W1, pokazana z 1 miejscem, DEC-34 a) z informacją o 4 in i 10 cm. Wyrocznia: wektor BRD i ER-62.
# BR-KAL-001/S1 (tamże :60, RD-01): liczba oczek na szerokość — region symulatora en-US daje jednostki calowe (P-075 (4a) „auto”), więc wektor
# RD-01-W1 (cm) nie pasuje; tu 20 o./4 in × 10 in = 50 oczek — rachunek niezależny (5 o./in × 10 in), nie wynik kodu.
# Kalkulator „Swatch” z „Tools” (04 fix-6 D, P-191 P7a), wynik na żywo bez przycisku. Funkcja bez UI na 2026-10-26 — pakiet pełny.
appId: com.apps4brew.knitting
name: "BR-KAL-003/S1 · Próbka 20 na 4 in: 19.7 na 10 cm; 10 in → 50 oczek (BR-KAL-001/S1)"
tags:
  - BR-KAL-003-S1
  - BR-KAL-001-S1
---
- runFlow:
    file: subflows/start-czysty.yaml
    env:
      TERAZ: "2026-11-10T12:00:00"
- tapOn: { id: "nav-wstecz" } # P-583: licznik bez wejścia do listy — wstecz do ekranu źródłowego („Dziś” albo Projekty), potem zakładka Projekty
- extendedWaitUntil: { visible: { id: "nav-projekty" }, timeout: 20000 }
- tapOn: { id: "nav-projekty" }
- assertVisible: { id: "projekty-lista" }
- tapOn: { id: "nav-narzedzia" }
- assertVisible: { id: "narzedzia-probka" }
- takeScreenshot: 41-narzedzia-wejscie
- tapOn: { id: "narzedzia-probka" }
- assertVisible: { id: "probka-oczka" }
- assertVisible: "per 4 in"
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "probka-oczka" }
      - waitForAnimationToEnd
      - eraseText: 10
      - inputText: "2"
      - inputText: "0"
      - assertVisible: { id: "probka-oczka", text: "20" }
- assertVisible: "= 19.7 stitches per 10 cm"
- assertVisible: "The standard way to give gauge is .*"
- retry:
    maxRetries: 1
    commands:
      # P-489 3c (#145): po wpisie w „probka-oczka” klawiatura dziesiętna zasłaniała pole szerokości; hideKeyboard odpada (klawiatura liczbowa iOS nie ma akcji schowania),
      # więc wyśrodkowanie pola w ScrollView (automaticallyAdjustKeyboardInsets) przed stuknięciem
      # P-608 G3: przebieg 42544112861 (oba podejścia): pole y 578–622 pod klawiaturą, scrollUntilVisible kończy się bez przewinięcia (Maestro nie widzi klawiatury),
      # stuknięcie trafia w klawiaturę, a „10” ląduje w probka-oczka (zrzut step-049). Najpierw chowamy klawiaturę stuknięciem w zwykły tekst
      # (ScrollView keyboardShouldPersistTaps="handled", Narzedzia.tsx:93 — stuknięcie poza kontrolką zamyka klawiaturę).
      - tapOn: { text: "The standard way to give gauge is .*" }
      - waitForAnimationToEnd
      - assertVisible: { id: "probka-oczka", text: "20" } # stuknięcie w tekst nie zmieniło pola oczek
      - scrollUntilVisible: { element: { id: "probka-szerokosc" }, direction: DOWN, timeout: 30000, centerElement: true }
      - tapOn: { id: "probka-szerokosc" }
      - waitForAnimationToEnd
      - eraseText: 10
      - inputText: "1"
      - inputText: "0"
      - assertVisible: { id: "probka-szerokosc", text: "10" }
- assertVisible: { id: "probka-wynik-oczka", text: ".*50 stitches.*" }
- assertVisible: { id: "probka-wynik-grubosc" }
- takeScreenshot: 41-probka
