appId: com.apps4brew.knitting
name: "Zrzuty sklepu · 02 licznik w trakcie z notatką"
# Scena: restart na danych z 00-przygotuj.yaml, nawigacja bez +1; zrzut robi scripts/ci/zrzuty-sklepu.sh (simctl io screenshot, natywne piksele).
---
- stopApp
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: ${ZRZUTY_TERAZ}
      oczkoE2eSiec: "brak"
- extendedWaitUntil: { visible: { id: "dzis-karta" }, timeout: 60000 }
- setOrientation: PORTRAIT
- assertNotVisible: { id: "okno-uczciwe-zasady" }
- assertVisible: { id: "dzis-projekt", text: "Harbor Sweater" }
- tapOn: { id: "dzis-kontynuuj" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 30000 }
- assertVisible: { id: "licznik-wartosc", text: "47" }
- assertVisible: { id: "licznik-notatka", text: ".*next: 3 knit, then cable.*" }
