appId: com.apps4brew.knitting
name: "Zrzuty sklepu · 07 kalendarz dni pracy"
# Scena: restart na danych z 00-przygotuj.yaml, nawigacja bez +1; zrzut robi scripts/ci/zrzuty-sklepu.sh (simctl io screenshot, natywne piksele).
---
- stopApp
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: "2026-11-10T09:41:00"
      oczkoE2eSiec: "brak"
- extendedWaitUntil: { visible: { id: "dzis-karta" }, timeout: 60000 }
- setOrientation: PORTRAIT
- assertNotVisible: { id: "okno-uczciwe-zasady" }
- assertVisible: { id: "dzis-projekt", text: "Harbor Sweater" }
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "nav-historia" }
- assertVisible: { id: "historia-kalendarz" }
- tapOn: { id: "historia-dzien-2026-11-05" }
- assertVisible: { id: "historia-dzien-2026-11-05", selected: true }
