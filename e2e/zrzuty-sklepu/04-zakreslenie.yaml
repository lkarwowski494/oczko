appId: com.apps4brew.knitting
name: "Zrzuty sklepu · 04 zakreślenie na wzorze (iPad poziomo)"
# Scena: restart na danych z 00-przygotuj.yaml, nawigacja bez +1; zrzut robi scripts/ci/zrzuty-sklepu.sh (simctl io screenshot, natywne piksele).
---
- stopApp
- launchApp:
    clearState: false
    arguments:
      oczkoE2eTeraz: ${ZRZUTY_TERAZ}
      oczkoE2eSiec: "brak"
- extendedWaitUntil: { visible: { id: "dzis-karta" }, timeout: 60000 }
- setOrientation: PORTRAIT
- assertNotVisible: { id: "okno-uczciwe-zasady" }
- assertVisible: { id: "dzis-projekt", text: "${PROJ_GLOWNY}" }
- tapOn: { id: "dzis-kontynuuj" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 30000 }
- assertVisible: { id: "licznik-wartosc", text: "20" }
# „Kontynuuj ›” wraca do ostatniego miejsca pracy: po scenie 03 to strona wzoru (run 42777145130: zrzut porażki sceny 04), po 02 licznik — obie drogi dają wzór
- runFlow:
    when: { notVisible: { id: "wzor-widok" } }
    commands:
      - scrollUntilVisible: { element: { id: "licznik-wzor" }, direction: DOWN, timeout: 30000 }
      - tapOn: { id: "licznik-wzor" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- setOrientation: ${ORIENT_WZOR}
- tapOn: { id: "wzor-zakreslacz" }
- assertVisible: { id: "wzor-zakreslacz", selected: true }
# 014: kadr 04 różni się od 03 — zakreślacz włączony i DRUGIE zakreślenie (pierwsze z fikstury) przez wiersze wzoru niżej na stronie (pozycje % ekranu; strona PDF z wzor-sklepu.ts ma tekst w górnych ~70% strony)
# 019: fikstura zostawia jedno zakreślenie (zrobione w tej samej orientacji); licznik z cyfrą 1 przed swipe'em, z cyfrą 2 po nim (cyfra bez słowa: ten sam scenariusz w każdym języku)
- assertVisible: { id: "wzor-zakreslenia", text: '^\D*1\D*$' } # P3 (KO-043): ściśle cyfra 1, bez innych cyfr (poprzedni wzorzec z kropką-gwiazdką po obu stronach pasował też do „12”, „21”)
# ZR3 (P-998, WR2 Z2): zakreślenie 2 = wiersz „Row 13”/„Rząd 13” (drugi wiersz z warkoczem), od początku tekstu do końca wiersza; współrzędne ZAKR_2_* z dane/<klucz>.json (jak ZAKR_1_* w 00-przygotuj).
- swipe: { start: "${ORIENT_WZOR == 'PORTRAIT' ? ZAKR_2_OD_IPHONE : ZAKR_2_OD_IPAD}", end: "${ORIENT_WZOR == 'PORTRAIT' ? ZAKR_2_DO_IPHONE : ZAKR_2_DO_IPAD}", duration: 800 }
- assertVisible: { id: "wzor-zakreslenia", text: '^\D*2\D*$' } # licznik z cyfrą 2 w każdym języku (słowniki wzor.zakreslenia_<forma dla 2> = „{{count}} …”); pierwsze zakreślenie z 00-przygotuj + to
# 019 (AO, KO-044; P-748, P-749): opcja 1 z P-746 (wyłączenie zakreślacza przed zrzutem) obalona w przebiegu 43090241469 — przyczyna była w aplikacji
# (pociągnięcie na płótnie z rysunkiem wczytanym z pliku nie było rysowane; poprawka w WidokWzoru.swift). Scena bez obejścia: zakreślacz zostaje włączony do zrzutu.
# Zrzut Maestro zaraz po swipe (dzienniki, nie komplet sklepu) pokazuje stan płótna przed zrzutem skryptu. Opis: docs/programista/zrzuty-018-019-an.md (sekcja AO).
- takeScreenshot: 04-po-swipe
- assertVisible: { id: "wzor-zakreslacz", selected: true }
