# Dane (nazwy projektów, notatka, wzór) z zmiennych -e z e2e/zrzuty-sklepu/dane/<klucz>.json przez scripts/ci/zrzuty-dane.mjs (013: dane w języku zestawu).
# Zrzuty sklepu (rola 10, zadanie E-2; plan: docs/wydanie/metadane/zrzuty-plan.md). Dane WYŁĄCZNIE fikcyjne (2.3.9): projekty (en) „Cable Hat” (główny, jak wzór), „Moss Socks”,
# „Harbor Sweater”, „Baby Blanket”; 020: nazwa projektu głównego = nazwa wzoru w każdym języku (tests/wydanie/zrzuty-dane-spojnosc.test.ts); wzór = PDF z treścią z buildu E2E (panel e2e-wzor-sklep-<język danych>, src/kompozycja/e2e/wzor-sklepu.ts, bez okna Plików); dni pracy −7, −5 i −1 dnia względem dnia przebiegu (ZRZUTY_SESJA_1..3 z `zrzuty-uzupelnij.mjs dni`, 10-wydanie-023), „dziś” w scenach = ZRZUTY_TERAZ (dzień przebiegu, 9:41; niesiony przez plan do każdego zadania; ta sama godzina na pasku stanu, a data paska iPada to data maszyny = dzień przebiegu — tests/wydanie/zrzuty-data-ipada.test.ts).
# Nigdy +1 na ekranie licznika w scenach (panel pomiaru E2E „p95 … ms” zostałby w kadrze); tu +1 jest, bo po restarcie panel znika (stan w pamięci widoku).
# Kolejność ma znaczenie: ostatnio pracowano w projekcie głównym (${PROJ_GLOWNY}), więc „Kontynuuj ›” prowadzi do niego (restart.yaml).
appId: com.apps4brew.knitting
name: "Zrzuty sklepu · 00 przygotowanie danych fikcyjnych (4 projekty, wzór, notatka, trzy dni pracy)"
---
# --- sesja 1 (−7 dni): cztery projekty, „Harbor Sweater” ostatni; trzy rzędy ---
- runFlow:
    file: ../scenariusze/subflows/start-czysty-dzis.yaml
    env:
      TERAZ: ${ZRZUTY_SESJA_1}
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true }
- extendedWaitUntil: { visible: { id: "projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "projekty-nowy" }
- assertVisible: { id: "formularz-nazwa-projektu" }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "formularz-nazwa-projektu" }
      - waitForAnimationToEnd
      - eraseText: 30
      - inputText: ${PROJ_2}
      - assertVisible: { id: "formularz-nazwa-projektu", text: "${PROJ_2}" }
- pressKey: Enter
- assertVisible: { id: "formularz-zapisz" }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- assertVisible: { id: "licznik-projekt", text: "${PROJ_2}" }
- runFlow:
    file: ../scenariusze/subflows/wpisz-wartosc.yaml
    env:
      WARTOSC: "24"
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "nav-projekty" }, timeout: 20000 }
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true }
- extendedWaitUntil: { visible: { id: "projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "projekty-nowy" }
- assertVisible: { id: "formularz-nazwa-projektu" }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "formularz-nazwa-projektu" }
      - waitForAnimationToEnd
      - eraseText: 30
      - inputText: ${PROJ_3}
      - assertVisible: { id: "formularz-nazwa-projektu", text: "${PROJ_3}" }
- pressKey: Enter
- assertVisible: { id: "formularz-zapisz" }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- assertVisible: { id: "licznik-projekt", text: "${PROJ_3}" }
- runFlow:
    file: ../scenariusze/subflows/wpisz-wartosc.yaml
    env:
      WARTOSC: "9"
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "nav-projekty" }, timeout: 20000 }
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true }
- extendedWaitUntil: { visible: { id: "projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "projekty-nowy" }
- assertVisible: { id: "formularz-nazwa-projektu" }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "formularz-nazwa-projektu" }
      - waitForAnimationToEnd
      - eraseText: 30
      - inputText: ${PROJ_4}
      - assertVisible: { id: "formularz-nazwa-projektu", text: "${PROJ_4}" }
- pressKey: Enter
- assertVisible: { id: "formularz-zapisz" }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- assertVisible: { id: "licznik-projekt", text: "${PROJ_4}" }
- runFlow:
    file: ../scenariusze/subflows/wpisz-wartosc.yaml
    env:
      WARTOSC: "61"
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "nav-projekty" }, timeout: 20000 }
- tapOn: { id: "nav-projekty" }
- extendedWaitUntil: { visible: { id: "okno-uczciwe-zasady|projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "uczciwe-zasady-zamknij", optional: true }
- extendedWaitUntil: { visible: { id: "projekty-lista|projekty-dni-darmowe" }, timeout: 30000 }
- tapOn: { id: "projekty-nowy" }
- assertVisible: { id: "formularz-nazwa-projektu" }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "formularz-nazwa-projektu" }
      - waitForAnimationToEnd
      - eraseText: 30
      - inputText: ${PROJ_GLOWNY}
      - assertVisible: { id: "formularz-nazwa-projektu", text: "${PROJ_GLOWNY}" }
- pressKey: Enter
- assertVisible: { id: "formularz-zapisz" }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- assertVisible: { id: "licznik-projekt", text: "${PROJ_GLOWNY}" }
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "1" }
- runFlow: ../scenariusze/subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "2" }
- runFlow: ../scenariusze/subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "3" }
# --- sesja 2 (−5 dni): dwa rzędy więcej ---
- runFlow: { file: ../scenariusze/subflows/restart.yaml, env: { TERAZ: ${ZRZUTY_SESJA_2} } }
- assertVisible: { id: "licznik-wartosc", text: "3" }
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "4" }
- runFlow: ../scenariusze/subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "5" }
# --- sesja 3 (−1 dnia, w tygodniu „dziś”): rząd 45 wpisany, dwa stuknięcia do 47 (dzień pracy: „This week” w kadrach nie jest pusty, 016), notatka, wzór ze znacznikiem i zakreśleniem ---
# Godziny sesji rosną razem z datą (−7 dni 18:00, −5 dni 19:30, −1 dnia 20:00), więc Historia (od najnowszego, sama godzina bez daty) czyta się chronologicznie (016).
- runFlow: { file: ../scenariusze/subflows/restart.yaml, env: { TERAZ: ${ZRZUTY_SESJA_3} } }
- runFlow:
    file: ../scenariusze/subflows/wpisz-wartosc.yaml
    env:
      WARTOSC: "45"
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "46" }
- runFlow: ../scenariusze/subflows/odstep.yaml
- tapOn: { id: "licznik-plus" }
- assertVisible: { id: "licznik-wartosc", text: "47" }
- scrollUntilVisible: { element: { id: "licznik-akcja-notatka" }, direction: DOWN, timeout: 30000 }
- tapOn: { id: "licznik-akcja-notatka" }
- assertVisible: { id: "formularz-notatka" }
- retry:
    maxRetries: 1
    commands:
      - tapOn: { id: "formularz-notatka" }
      - waitForAnimationToEnd
      - eraseText: 60
      - inputText: ${NOTATKA}
      - assertVisible: { id: "formularz-notatka", text: "${NOTATKA}" }
- tapOn: { id: "formularz-zapisz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
# 014: wzór z treścią z panelu E2E zrzutów (e2e-wzor-sklep-<klucz danych>) zamiast „Test pattern”; reszta jak subflow otworz-wzor-pdf
- scrollUntilVisible: { element: { id: "licznik-wzor" }, direction: DOWN, timeout: 30000 }
- tapOn: { id: "licznik-wzor" }
- assertVisible: { id: "e2e-wzor-sklep-${DANE_KLUCZ}" }
- tapOn: { id: "e2e-wzor-sklep-${DANE_KLUCZ}" }
- extendedWaitUntil: { visible: { id: "wzor-widok" }, timeout: 30000 }
- tapOn: { id: "wzor-zaznacz" }
- assertVisible: { id: "wzor-kierunek" }
- tapOn: "Down, like written steps"
- assertVisible: { id: "wzor-znacznik-rzad", text: "48" }
- tapOn: { id: "wzor-znacznik-gotowe" }
- assertNotVisible: { id: "wzor-znacznik-pasek" }
# 019: zakreślenia to pociągnięcia w układzie STRONY, więc pierwsze zakreślenie powstaje w orientacji kadrów 03 i 04 (ORIENT_WZOR: iPad poziomo, iPhone pionowo); w pionie wypadało
# poza poziomym kadrem 04 (licznik „2”, na zrzucie jedno zakreślenie). Wysokość swipe'u różni się od swipe'u sceny 04 (tests/wydanie/zrzuty-zakreslenia.test.ts).
- setOrientation: ${ORIENT_WZOR}
- extendedWaitUntil: { visible: { id: "wzor-zakreslacz" }, timeout: 30000 }
- tapOn: { id: "wzor-zakreslacz" }
- assertVisible: { id: "wzor-zakreslacz", selected: true }
- swipe: { start: "20%, 40%", end: "80%, 40%", duration: 800 }
- assertVisible: { id: "wzor-zakreslenia", text: "1 highlight" }
- tapOn: { id: "wzor-zakreslacz" }
- assertVisible: { id: "wzor-zakreslacz", selected: false }
- setOrientation: PORTRAIT
# wyjście z wzoru do licznika: ostatnie miejsce pracy = licznik projektu głównego
- tapOn: { id: "nav-wstecz" }
- extendedWaitUntil: { visible: { id: "licznik-plus" }, timeout: 20000 }
- assertVisible: { id: "licznik-wartosc", text: "47" }
